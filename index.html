<script>

"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    ctx.imageSmoothingEnabled=false;
}

resize();

window.addEventListener("resize",resize);


/* =====================================================
   ŚWIAT
===================================================== */

const TILE=32;
const WORLD_W=400;
const WORLD_H=70;

const BLOCK={

    air:{
        solid:false,
        color:"transparent"
    },

    grass:{
        solid:true,
        color:"#4fa331"
    },

    dirt:{
        solid:true,
        color:"#87502a"
    },

    stone:{
        solid:true,
        color:"#707070"
    },

    wood:{
        solid:true,
        color:"#92552b"
    },

    leaves:{
        solid:false,
        color:"#29933a"
    },

    sand:{
        solid:true,
        color:"#dbc477"
    },

    water:{
        solid:false,
        color:"#35a9df"
    }
};

let world=[];


/* =====================================================
   GENEROWANIE ŚWIATA
===================================================== */

function createWorld(){

    world=[];

    for(let y=0;y<WORLD_H;y++){

        world[y]=[];

        for(let x=0;x<WORLD_W;x++){
            world[y][x]="air";
        }
    }


    /* TEREN */

    for(let x=0;x<WORLD_W;x++){

        let ground=Math.floor(
            27+
            Math.sin(x*0.05)*3+
            Math.sin(x*0.018)*5
        );

        ground=Math.max(
            18,
            Math.min(38,ground)
        );


        for(let y=ground;y<WORLD_H;y++){

            if(y===ground){

                world[y][x]="grass";

            }else if(y<ground+5){

                world[y][x]="dirt";

            }else{

                world[y][x]="stone";
            }
        }
    }


    /* DRZEWA */

    for(let x=8;x<WORLD_W-8;x++){

        if(Math.random()<0.045){

            let ground=findGround(x);

            let height=
                4+
                Math.floor(Math.random()*2);


            for(
                let y=ground-1;
                y>=ground-height;
                y--
            ){

                if(y>=0){
                    world[y][x]="wood";
                }
            }


            let top=ground-height;


            for(
                let y=top-2;
                y<=top+1;
                y++
            ){

                for(
                    let xx=x-2;
                    xx<=x+2;
                    xx++
                ){

                    if(
                        xx>=0 &&
                        xx<WORLD_W &&
                        y>=0 &&
                        y<WORLD_H
                    ){

                        if(
                            Math.abs(xx-x)+
                            Math.abs(y-top)<=3 &&
                            world[y][xx]==="air"
                        ){

                            world[y][xx]="leaves";
                        }
                    }
                }
            }
        }
    }


    /* MAŁE STAWY */

    for(let i=0;i<12;i++){

        let x=
            10+
            Math.floor(
                Math.random()*(WORLD_W-20)
            );

        let width=
            2+
            Math.floor(Math.random()*3);


        for(
            let xx=x-width;
            xx<=x+width;
            xx++
        ){

            if(
                xx<1 ||
                xx>=WORLD_W-1
            ) continue;


            let ground=findGround(xx);

            world[ground][xx]="water";
        }
    }


    /* STARTOWA POLANA */

    for(let x=8;x<18;x++){

        let ground=findGround(x);

        world[ground][x]="grass";
    }
}


/* =====================================================
   ZNAJDOWANIE ZIEMI
===================================================== */

function findGround(x){

    if(x<0 || x>=WORLD_W){
        return 30;
    }

    for(let y=0;y<WORLD_H;y++){

        const type=world[y][x];

        if(
            type!=="air" &&
            type!=="leaves" &&
            type!=="water"
        ){

            return y;
        }
    }

    return 30;
}

}

/* =====================================================
   STEROWANIE TELEFONEM
===================================================== */

function hold(element,key){

    function start(e){

        e.preventDefault();

        keys[key]=true;
    }


    function end(e){

        e.preventDefault();

        keys[key]=false;
    }


    element.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        end,
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        end,
        {passive:false}
    );


    element.addEventListener(
        "mousedown",
        start
    );

    window.addEventListener(
        "mouseup",
        end
    );
}

/* =====================================================
   KOLIZJE
===================================================== */

function solidAtPixel(px,py){

    const tx=
        Math.floor(px/TILE);

    const ty=
        Math.floor(py/TILE);


    if(
        tx<0 ||
        tx>=WORLD_W ||
        ty<0
    ){

        return true;
    }


    if(ty>=WORLD_H){
        return true;
    }


    const type=world[ty][tx];

    return(
        BLOCK[type] &&
        BLOCK[type].solid
    );
}


function playerCollision(x,y){

    const p=2;


    return(

        solidAtPixel(
            x+p,
            y+p
        )

        ||

        solidAtPixel(
            x+player.width-p,
            y+p
        )

        ||

        solidAtPixel(
            x+p,
            y+player.height-p
        )

        ||

        solidAtPixel(
            x+player.width-p,
            y+player.height-p
        )
    );
}


/* =====================================================
   RUCH POSTACI
===================================================== */

function updatePlayer(){

    let moving=false;


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        player.vx=-player.speed;

        player.direction=-1;

        moving=true;

    }else if(
        keys["d"] ||
        keys["arrowright"]
    ){

        player.vx=player.speed;

        player.direction=1;

        moving=true;

    }else{

        player.vx*=0.65;
    }


    if(Math.abs(player.vx)<0.02){
        player.vx=0;
    }


    /* WOLNIEJSZA ANIMACJA */

    if(
        moving &&
        player.grounded
    ){

        player.walkAnimation+=0.11;

    }else{

        player.walkAnimation*=0.8;
    }


    /* GRAWITACJA */

    player.vy+=0.38;

    if(player.vy>9){
        player.vy=9;
    }


    /* RUCH POZIOMY */

    const newX=
        player.x+
        player.vx;


    if(
        !playerCollision(
            newX,
            player.y
        )
    ){

        player.x=newX;

    }else{

        player.vx=0;
    }


    /* RUCH PIONOWY */

    const newY=
        player.y+
        player.vy;


    if(
        !playerCollision(
            player.x,
            newY
        )
    ){

        player.y=newY;

        player.grounded=false;

    }else{

        if(player.vy>0){

            player.grounded=true;


            const tileBottom=
                Math.floor(
                    (
                        player.y+
                        player.height
                    )/TILE
                );


            player.y=
                tileBottom*TILE-
                player.height-
                0.01;
        }


        player.vy=0;
    }


    /* KAMERA */

    const targetX=
        player.x+
        player.width/2-
        canvas.width/2;


    const targetY=
        player.y+
        player.height/2-
        canvas.height/2;


    camera.x+=
        (
            targetX-camera.x
        )*0.055;


    camera.y+=
        (
            targetY-camera.y
        )*0.055;


    const maxX=
        Math.max(
            0,
            WORLD_W*TILE-
            canvas.width
        );


    const maxY=
        Math.max(
            0,
            WORLD_H*TILE-
            canvas.height
        );


    camera.x=
        Math.max(
            0,
            Math.min(
                camera.x,
                maxX
            )
        );


    camera.y=
        Math.max(
            0,
            Math.min(
                camera.y,
                maxY
            )
        );


    if(
        player.y>
        WORLD_H*TILE+200
    ){

        spawnPlayer();
    }
}

function drawSky(){

    ctx.fillStyle="#76caff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle=
        "rgba(255,255,255,.7)";


    drawCloud(
        150-camera.x*0.15,
        100
    );

    drawCloud(
        550-camera.x*0.1,
        150
    );

    drawCloud(
        900-camera.x*0.12,
        80
    );
}


function drawCloud(x,y){

    ctx.fillRect(
        x,
        y,
        90,
        20
    );

    ctx.fillRect(
        x+20,
        y-12,
        40,
        25
    );

    ctx.fillRect(
        x+55,
        y-6,
        35,
        20
    );
}


/* =====================================================
   ŚWIAT
===================================================== */

function drawWorld(){

    drawSky();


    const startX=
        Math.max(
            0,
            Math.floor(camera.x/TILE)-1
        );


    const endX=
        Math.min(
            WORLD_W,
            Math.ceil(
                (
                    camera.x+
                    canvas.width
                )/TILE
            )+1
        );


    const startY=
        Math.max(
            0,
            Math.floor(camera.y/TILE)-1
        );


    const endY=
        Math.min(
            WORLD_H,
            Math.ceil(
                (
                    camera.y+
                    canvas.height
                )/TILE
            )+1
        );


    for(let y=startY;y<endY;y++){

        for(let x=startX;x<endX;x++){

            drawBlock(
                world[y][x],
                x,
                y
            );
        }
    }
}


/* =====================================================
   BLOKI
===================================================== */

function drawBlock(type,tx,ty){

    if(type==="air"){
        return;
    }


    const x=
        tx*TILE-camera.x;

    const y=
        ty*TILE-camera.y;


    if(
        x<-TILE ||
        y<-TILE ||
        x>canvas.width ||
        y>canvas.height
    ){

        return;
    }


    /* WODA */

    if(type==="water"){

        ctx.fillStyle="#35a9df";

        ctx.fillRect(
            x,
            y,
            TILE,
            TILE
        );


        ctx.fillStyle="#78d8fa";

        ctx.fillRect(
            x,
            y+
            5+
            Math.sin(
                Date.now()*0.004+tx
            )*2,
            TILE,
            3
        );

        return;
    }


    ctx.fillStyle=
        BLOCK[type].color;


    ctx.fillRect(
        x,
        y,
        TILE,
        TILE
    );


    /* TRAWА */

    if(type==="grass"){

        ctx.fillStyle="#73d63c";

        ctx.fillRect(
            x,
            y,
            TILE,
            6
        );


        ctx.fillStyle="#347f26";

        ctx.fillRect(
            x+6,
            y+5,
            3,
            5
        );

        ctx.fillRect(
            x+21,
            y+3,
            3,
            6
        );
    }


    /* ZIEMIA */

    if(type==="dirt"){

        ctx.fillStyle="#70401f";

        ctx.fillRect(
            x+6,
            y+9,
            4,
            4
        );

        ctx.fillRect(
            x+21,
            y+21,
            4,
            4
        );
    }


    /* KAMIEŃ */

    if(type==="stone"){

        ctx.fillStyle="#5d5d5d";

        ctx.fillRect(
            x+5,
            y+7,
            6,
            5
        );

        ctx.fillRect(
            x+20,
            y+20,
            5,
            5
        );
    }


    /* DREWNO */

    if(type==="wood"){

        ctx.fillStyle="#613716";

        ctx.fillRect(
            x+13,
            y,
            5,
            TILE
        );
    }


    /* LIŚCIE */

    if(type==="leaves"){

        ctx.fillStyle="#1e762a";

        ctx.fillRect(
            x+5,
            y+7,
            8,
            7
        );

        ctx.fillRect(
            x+20,
            y+18,
            7,
            6
        );
    }


    /* PIACH */

    if(type==="sand"){

        ctx.fillStyle="#b6a25d";

        ctx.fillRect(
            x+6,
            y+9,
            3,
            3
        );

        ctx.fillRect(
            x+21,
            y+21,
            3,
            3
        );
    }
}

function drawPlayer(){

    const screenX=
        Math.round(
            player.x-camera.x
        );

    const screenY=
        Math.round(
            player.y-camera.y
        );


    let sprite;


    /*
       Jeżeli stoimy:
       idle.

       Jeżeli chodzimy:

    */

    if(
        !player.grounded ||
        Math.abs(player.vx)<0.05

        const frame=
            Math.floor(
                player.walkAnimation*2
            )%2;


        sprite=
            frame===0
            ? PLAYER_SPRITES.walk1
            : PLAYER_SPRITES.walk2;
    }


    /*
       Mruganie
    */

    const blinkTime=
        Math.floor(
            Date.now()/100
        )%70;


    if(
        blinkTime===0 ||
        blinkTime===1
    ){

        sprite=
            createBlinkSprite(sprite);
    }


    ctx.save();

    ctx.imageSmoothingEnabled=false;


    /*
       Sprite 10x20.
       Każdy pixel = 2x2.
       Cała postać = 20x40.
    */

    const pixelSize=2;


    /*
       Patrzenie w lewo
    */

    if(player.direction<0){

        ctx.translate(
            screenX+player.width,
            screenY
        );

        ctx.scale(-1,1);

        drawPlayerSprite(
            0,
            0,
            sprite,
            pixelSize
        );

    }else{

        drawPlayerSprite(
            screenX,
            screenY,
            sprite,
            pixelSize
        );
    }


    ctx.restore();
}


/* =====================================================
   RYSOWANIE POJEDYNCZYCH PIKSELI
===================================================== */

function drawPlayerSprite(
    x,
    y,
    sprite,
    pixelSize
){

    for(
        let row=0;
        row<sprite.length;
        row++
    ){

        const line=sprite[row];


        for(
            let col=0;
            col<line.length;
            col++
        ){

            const pixel=line[col];


            if(pixel==="."){
                continue;
            }


            const color=
                PLAYER_PALETTE[pixel];


            if(!color){
                continue;
            }


            ctx.fillStyle=color;


            /*
               Jeden znak = jeden piksel.
            */

            ctx.fillRect(
                x+
                col*pixelSize,

                y+
                row*pixelSize,

                pixelSize,
                pixelSize
            );
        }
    }
}

   ZASIĘG
===================================================== */

function canReach(tx,ty){

    const px=
        player.x+
        player.width/2;

    const py=
        player.y+
        player.height/2;


    const bx=
        tx*TILE+
        TILE/2;

    const by=
        ty*TILE+
        TILE/2;


    const dx=bx-px;
    const dy=by-py;


    return(
        Math.sqrt(
            dx*dx+
            dy*dy
        )
        <=
        TILE*5
    );
}


/* =====================================================
   MYSZKA
===================================================== */

function mouseTile(e){

    const rect=
        canvas.getBoundingClientRect();


    const x=
        e.clientX-
        rect.left+
        camera.x;


    const y=
        e.clientY-
        rect.top+
        camera.y;


    return{

        x:Math.floor(x/TILE),

        y:Math.floor(y/TILE)
    };
}


canvas.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


canvas.addEventListener(
    "mousedown",
    e=>{

        const tile=
            mouseTile(e);


        if(
            tile.x<0 ||
            tile.x>=WORLD_W ||
            tile.y<0 ||
            tile.y>=WORLD_H
        ){

            return;
        }


        if(
            !canReach(
                tile.x,
                tile.y
            )
        ){

            return;
        }


        /* KOPANIE */

        if(e.button===0){

            const type=
                world[tile.y][tile.x];


            if(
                type==="air" ||
                type==="water" ||
                type==="leaves"
            ){

                return;
            }


            world[tile.y][tile.x]="air";


            if(
                type==="grass" ||
                type==="dirt"
            ){

                inventory.dirt++;
            }


            if(type==="stone"){
                inventory.stone++;
            }


            if(type==="wood"){
                inventory.wood++;
            }


            if(type==="sand"){
                inventory.sand++;
            }


            updateHotbar();
        }


        /* STAWIANIE */

        if(e.button===2){

            if(
                world[tile.y][tile.x]!=="air"
            ){

                return;
            }


            if(
                inventory[selectedBlock]<=0
            ){

                showMessage(
                    "Brak bloku!"
                );

                return;
            }


            const bx=
                tile.x*TILE;

            const by=
                tile.y*TILE;


            const overlap=
                bx<
                player.x+
                player.width &&

                bx+TILE>
                player.x &&

                by<
                player.y+
                player.height &&

                by+TILE>
                player.y;


            if(overlap){
                return;
            }


            world[tile.y][tile.x]=
                selectedBlock;


            inventory[selectedBlock]--;

            updateHotbar();
        }
    }
);

function loadGame(){

    try{

        const raw=
            localStorage.getItem(
                SAVE_KEY
            );


        if(!raw){
            return;
        }


        const data=
            JSON.parse(raw);


        if(
            !data ||
            !Array.isArray(data.world)
        ){

            return;
        }


        if(
            data.world.length!==WORLD_H
        ){

            return;
        }


        for(
            let y=0;
            y<WORLD_H;
            y++
        ){

            if(
                !Array.isArray(
                    data.world[y]
                ) ||
                data.world[y].length!==WORLD_W
            ){

                return;
            }
        }


        world=data.world;


        if(
            data.player &&
            Number.isFinite(
                data.player.x
            ) &&
            Number.isFinite(
                data.player.y
            )
        ){

            player.x=data.player.x;
            player.y=data.player.y;
        }


        if(data.inventory){

            for(
                const type of
                [
                    "dirt",
                    "stone",
                    "wood",
                    "sand"
                ]
            ){

                if(
                    Number.isFinite(
                        data.inventory[type]
                    )
                ){

                    inventory[type]=
                        Math.max(
                            0,
                            Math.floor(
                                data.inventory[type]
                            )
                        );
                }
            }
        }


        if(
            typeof data.selected==="string" &&
            inventory[data.selected]!==undefined
        ){

            selectedBlock=
                data.selected;
        }


        if(
            playerCollision(
                player.x,
                player.y
            )
        ){

            spawnPlayer();
        }


    }catch(error){

        console.warn(
            "Stary zapis pominięty.",
            error
        );
    }
}


loadGame();
