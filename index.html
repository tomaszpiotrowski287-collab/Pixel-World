<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#72c9ff;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

button{
    font-family:Arial,sans-serif;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#logo{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-shadow:3px 3px #222;
}

#health{
    position:absolute;
    left:15px;
    top:15px;
    width:185px;
    height:25px;
    border:3px solid #222;
    background:#333;
}

#healthBar{
    height:100%;
    width:100%;
    background:#e53935;
    transition:width .15s;
}

#healthText{
    position:absolute;
    inset:0;
    text-align:center;
    line-height:19px;
    color:white;
    font-size:13px;
    font-weight:bold;
    text-shadow:1px 1px #000;
}

#info{
    position:absolute;
    right:15px;
    top:15px;
    color:white;
    text-align:right;
    font-size:13px;
    line-height:18px;
    text-shadow:2px 2px #000;
}

.uiButton{
    pointer-events:auto;
    border:2px solid #222;
    border-radius:7px;
    background:rgba(255,255,255,.78);
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

#saveButton{
    position:absolute;
    top:52px;
    left:15px;
    padding:7px 10px;
}

#craftButton{
    position:absolute;
    top:52px;
    right:15px;
    padding:7px 10px;
}

#crafting{
    display:none;
    position:absolute;
    top:100px;
    right:15px;
    width:270px;
    padding:12px;
    background:rgba(20,20,20,.96);
    color:white;
    border:3px solid #111;
    border-radius:8px;
    pointer-events:auto;
}

.recipe{
    margin-top:8px;
    padding:10px;
    background:#444;
    border:2px solid #666;
    border-radius:5px;
    cursor:pointer;
}

.recipe:active{
    background:#666;
}

#hotbar{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    pointer-events:auto;
}

.slot{
    width:57px;
    height:57px;
    border:3px solid #222;
    border-radius:4px;
    background:rgba(45,45,45,.9);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color:white;
    font-size:27px;
    cursor:pointer;
}

.slot.selected{
    border-color:white;
    box-shadow:0 0 0 2px #111;
}

.slot span{
    position:absolute;
    right:3px;
    bottom:1px;
    color:white;
    font-size:12px;
    font-weight:bold;
    text-shadow:2px 2px #000;
}

#controls{
    position:absolute;
    left:15px;
    bottom:15px;
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.control{
    width:65px;
    height:65px;
    border:3px solid #222;
    border-radius:12px;
    background:rgba(255,255,255,.55);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    touch-action:none;
}

#jumpButton{
    position:absolute;
    right:18px;
    bottom:18px;
    pointer-events:auto;
}

#message{
    position:absolute;
    left:50%;
    top:70%;
    transform:translateX(-50%);
    color:white;
    font-weight:bold;
    font-size:18px;
    text-shadow:2px 2px #000;
    opacity:0;
    transition:opacity .2s;
    white-space:nowrap;
}

@media(max-width:700px){

    #info{
        display:none;
    }

    #logo{
        font-size:18px;
    }

    #health{
        width:145px;
    }

    #hotbar{
        bottom:8px;
    }

    .slot{
        width:48px;
        height:48px;
        font-size:22px;
    }

    #controls{
        bottom:72px;
    }

    #jumpButton{
        bottom:72px;
    }

    #crafting{
        width:230px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div id="logo">PIXEL WORLD</div>

    <div id="health">
        <div id="healthBar"></div>
        <div id="healthText">100 / 100</div>
    </div>

    <button id="saveButton" class="uiButton">
        💾 Zapisz
    </button>

    <button id="craftButton" class="uiButton">
        🔨 Crafting
    </button>

    <div id="crafting">

        <b>CRAFTING</b>

        <div class="recipe" data-recipe="planks">
            🪵 2 drewna → 8 desek
        </div>

        <div class="recipe" data-recipe="torch">
            🔥 1 drewno + 1 kamień → 4 pochodnie
        </div>

        <div class="recipe" data-recipe="pickaxe">
            ⛏️ 5 drewna + 3 kamienie → kilof
        </div>

    </div>

    <div id="info">
        A / D lub ← / → — ruch<br>
        W / ↑ / Spacja — skok<br>
        LPM — kopanie<br>
        PPM — stawianie
    </div>

    <div id="controls">
        <div class="control" id="leftButton">←</div>
        <div class="control" id="rightButton">→</div>
    </div>

    <div class="control" id="jumpButton">↑</div>

    <div id="hotbar">

        <div class="slot selected" data-block="dirt">
            🟫<span>20</span>
        </div>

        <div class="slot" data-block="stone">
            🪨<span>10</span>
        </div>

        <div class="slot" data-block="wood">
            🪵<span>10</span>
        </div>

        <div class="slot" data-block="sand">
            🟨<span>10</span>
        </div>

        <div class="slot" data-block="torch">
            🔥<span>4</span>
        </div>

    </div>

    <div id="message"></div>

</div>

<script>

/* =========================================================
   PIXEL WORLD
   STABILNA WERSJA
========================================================= */

"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.imageSmoothingEnabled = false;
}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);


/* =========================================================
   USTAWIENIA
========================================================= */

const TILE = 32;

const WORLD_WIDTH = 600;
const WORLD_HEIGHT = 90;

const GRAVITY = 0.45;
const MAX_FALL_SPEED = 11;

const SAVE_KEY = "PIXEL_WORLD_SAVE_V3";


/* =========================================================
   BLOKI
========================================================= */

const BLOCKS = {

    air:{
        solid:false,
        color:null
    },

    grass:{
        solid:true,
        color:"#4fa532"
    },

    dirt:{
        solid:true,
        color:"#895229"
    },

    stone:{
        solid:true,
        color:"#737373"
    },

    wood:{
        solid:true,
        color:"#925429"
    },

    leaves:{
        solid:false,
        color:"#299438"
    },

    sand:{
        solid:true,
        color:"#d9c478"
    },

    water:{
        solid:false,
        color:"#329ed7"
    },

    torch:{
        solid:false,
        color:"#ffad2e"
    }
};


/* =========================================================
   ŚWIAT
========================================================= */

let world = [];

let worldSeed =
    Math.floor(Math.random()*999999);


function createEmptyWorld(){

    world =
        Array.from(
            {length:WORLD_HEIGHT},
            () => Array(WORLD_WIDTH).fill("air")
        );
}


/* =========================================================
   DETERMINISTYCZNY NOISE
========================================================= */

function wave(x){

    return (
        Math.sin(
            x*0.055 + worldSeed
        ) * 3 +

        Math.sin(
            x*0.021 + worldSeed*0.4
        ) * 6 +

        Math.sin(
            x*0.008 + worldSeed*0.17
        ) * 8
    );
}


function getSurface(x){

    return Math.floor(
        31 + wave(x)
    );
}


/* =========================================================
   GENEROWANIE ŚWIATA
========================================================= */

function generateWorld(){

    createEmptyWorld();


    /* ziemia */

    for(let x=0;x<WORLD_WIDTH;x++){

        let ground =
            Math.max(
                15,
                Math.min(
                    WORLD_HEIGHT-15,
                    getSurface(x)
                )
            );

        for(let y=ground;y<WORLD_HEIGHT;y++){

            if(y===ground){

                world[y][x]="grass";

            }else if(y<ground+6){

                world[y][x]="dirt";

            }else{

                world[y][x]="stone";
            }
        }
    }


    /* jaskinie */

    for(let i=0;i<230;i++){

        const cx =
            Math.floor(
                10 +
                Math.random()*
                (WORLD_WIDTH-20)
            );

        const cy =
            Math.floor(
                42 +
                Math.random()*35
            );

        const rx =
            2+Math.random()*6;

        const ry =
            1.5+Math.random()*4;


        for(
            let y=Math.floor(cy-ry);
            y<=Math.ceil(cy+ry);
            y++
        ){

            for(
                let x=Math.floor(cx-rx);
                x<=Math.ceil(cx+rx);
                x++
            ){

                if(
                    x<1 ||
                    x>=WORLD_WIDTH-1 ||
                    y<1 ||
                    y>=WORLD_HEIGHT-1
                ) continue;


                const dx=(x-cx)/rx;
                const dy=(y-cy)/ry;


                if(
                    dx*dx+dy*dy<1
                ){

                    /*
                     * Nie wycinamy powierzchni.
                     * Dzięki temu gracz nie wpada
                     * od razu pod mapę.
                     */

                    if(
                        y>getSurface(x)+5
                    ){
                        world[y][x]="air";
                    }
                }
            }
        }
    }


    /* drzewa */

    for(
        let x=6;
        x<WORLD_WIDTH-6;
        x++
    ){

        if(Math.random()<0.045){

            const ground =
                getSurface(x);

            const height =
                4+
                Math.floor(
                    Math.random()*3
                );


            /* pień */

            for(
                let y=ground-1;
                y>=ground-height;
                y--
            ){

                if(y>=1)
                    world[y][x]="wood";
            }


            /* liście */

            const top =
                ground-height;


            for(
                let y=top-2;
                y<=top+1;
                y++
            ){

                for(
                    let xx=x-2;
                    xx<=x+2;
                    xx++
                ){

                    if(
                        xx<0 ||
                        xx>=WORLD_WIDTH ||
                        y<1 ||
                        y>=WORLD_HEIGHT
                    ) continue;


                    const distance =
                        Math.abs(xx-x)+
                        Math.abs(y-top);


                    if(distance<=3){

                        if(
                            world[y][xx]==="air"
                        ){
                            world[y][xx]="leaves";
                        }
                    }
                }
            }
        }
    }


    /* małe zbiorniki wodne */

    for(let i=0;i<15;i++){

        const center =
            15+
            Math.floor(
                Math.random()*
                (WORLD_WIDTH-30)
            );

        const width =
            2+
            Math.floor(
                Math.random()*3
            );


        for(
            let x=center-width;
            x<=center+width;
            x++
        ){

            if(
                x<2 ||
                x>=WORLD_WIDTH-2
            ) continue;


            const ground =
                getSurface(x);


            /*
             * Woda jest tylko na powierzchni.
             * Nie tworzymy dziwnych jezior
             * wysoko w powietrzu.
             */

            world[ground][x]="water";

            if(
                ground+1<WORLD_HEIGHT
            ){
                world[ground+1][x]="water";
            }
        }
    }


    /* bezpieczny spawn */

    prepareSpawn();
}


/* =========================================================
   BEZPIECZNY SPAWN
========================================================= */

function prepareSpawn(){

    const spawnX=12;

    const ground=
        getSurface(spawnX);


    /*
     * Czyścimy miejsce nad graczem.
     */

    for(
        let y=ground-8;
        y<ground;
        y++
    ){

        if(y>=0)
            world[y][spawnX]="air";
    }


    /*
     * Pod spawnem musi być ziemia.
     */

    world[ground][spawnX]="grass";


    /*
     * Wyczyść kilka bloków obok,
     * żeby gracz nie pojawił się
     * wewnątrz drzewa.
     */

    for(
        let x=spawnX-2;
        x<=spawnX+2;
        x++
    ){

        for(
            let y=ground-7;
            y<ground;
            y++
        ){

            if(
                x>=0 &&
                x<WORLD_WIDTH &&
                y>=0
            ){
                world[y][x]="air";
            }
        }
    }
}


generateWorld();


/* =========================================================
   EKWIPUNEK
========================================================= */

let inventory={

    dirt:20,
    stone:10,
    wood:10,
    sand:10,
    torch:4
};

let selectedBlock="dirt";


function updateHotbar(){

    document
    .querySelectorAll(".slot")
    .forEach(slot=>{

        const type=
            slot.dataset.block;

        const amount=
            inventory[type] || 0;

        const counter=
            slot.querySelector("span");

        if(counter){
            counter.textContent=amount;
        }

        slot.classList.toggle(
            "selected",
            type===selectedBlock
        );
    });
}


document
.querySelectorAll(".slot")
.forEach(slot=>{

    slot.addEventListener(
        "click",
        ()=>{

            selectedBlock=
                slot.dataset.block;

            updateHotbar();
        }
    );
});


/* klawisze 1-5 */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key>="1" &&
            e.key<="5"
        ){

            const index=
                Number(e.key)-1;

            const slots=
                document.querySelectorAll(
                    ".slot"
                );

            if(slots[index]){

                selectedBlock=
                    slots[index].dataset.block;

                updateHotbar();
            }
        }
    }
);


/* =========================================================
   GRACZ
========================================================= */

const player={

    x:12*TILE,

    y:0,

    width:22,

    height:43,

    vx:0,

    vy:0,

    speed:3.4,

    jumpPower:9.5,

    grounded:false,

    direction:1,

    animation:0,

    health:100,

    maxHealth:100
};


/* spawn na ziemi */

function placePlayerAtSpawn(){

    const x=12;

    const ground=
        getSurface(x);

    player.x=
        x*TILE+
        (TILE-player.width)/2;

    player.y=
        ground*TILE-
        player.height-
        1;

    player.vx=0;
    player.vy=0;
}

placePlayerAtSpawn();


/* =========================================================
   KAMERA
========================================================= */

const camera={
    x:0,
    y:0
};


/* =========================================================
   INPUT
========================================================= */

const keys={};


window.addEventListener(
    "keydown",
    e=>{

        const key=
            e.key.toLowerCase();

        keys[key]=true;


        if(
            key===" " ||
            key==="w" ||
            key==="arrowup"
        ){

            e.preventDefault();

            jump();
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;
    }
);


/* =========================================================
   SKOK
========================================================= */

let jumpLock=false;


function jump(){

    if(
        player.grounded &&
        !jumpLock
    ){

        player.vy=
            -player.jumpPower;

        player.grounded=false;

        jumpLock=true;

        setTimeout(
            ()=>{
                jumpLock=false;
            },
            120
        );
    }
}


/* =========================================================
   MOBILNE PRZYCISKI
========================================================= */

function setupHoldButton(
    element,
    key
){

    const start=e=>{

        e.preventDefault();

        keys[key]=true;
    };

    const end=e=>{

        e.preventDefault();

        keys[key]=false;
    };


    element.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        end,
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        end,
        {passive:false}
    );


    element.addEventListener(
        "mousedown",
        start
    );

    window.addEventListener(
        "mouseup",
        end
    );
}


setupHoldButton(
    document.getElementById(
        "leftButton"
    ),
    "arrowleft"
);


setupHoldButton(
    document.getElementById(
        "rightButton"
    ),
    "arrowright"
);


const jumpButton=
    document.getElementById(
        "jumpButton"
    );


jumpButton.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        jump();
    },
    {passive:false}
);


jumpButton.addEventListener(
    "mousedown",
    e=>{
        e.preventDefault();
        jump();
    }
);


/* =========================================================
   KOLIZJE
========================================================= */

function isSolidTile(tx,ty){

    if(
        tx<0 ||
        tx>=WORLD_WIDTH ||
        ty<0 ||
        ty>=WORLD_HEIGHT
    ){

        return true;
    }


    const type=
        world[ty][tx];


    return (
        BLOCKS[type] &&
        BLOCKS[type].solid
    );
}


function isSolidPixel(px,py){

    const tx=
        Math.floor(px/TILE);

    const ty=
        Math.floor(py/TILE);

    return isSolidTile(tx,ty);
}


function playerCollides(
    x,
    y
){

    /*
     * Mały margines zapobiega
     * blokowaniu się o rogi.
     */

    const pad=2;


    return (

        isSolidPixel(
            x+pad,
            y+pad
        )

        ||

        isSolidPixel(
            x+player.width-pad,
            y+pad
        )

        ||

        isSolidPixel(
            x+pad,
            y+player.height-pad
        )

        ||

        isSolidPixel(
            x+player.width-pad,
            y+player.height-pad
        )
    );
}


/* =========================================================
   CZY GRACZ JEST W WODZIE
========================================================= */

function playerInWater(){

    const centerX=
        player.x+
        player.width/2;

    const centerY=
        player.y+
        player.height/2;

    const tx=
        Math.floor(centerX/TILE);

    const ty=
        Math.floor(centerY/TILE);


    if(
        tx<0||
        tx>=WORLD_WIDTH||
        ty<0||
        ty>=WORLD_HEIGHT
    ){
        return false;
    }


    return world[ty][tx]==="water";
}


/* =========================================================
   UPDATE GRACZA
========================================================= */

function updatePlayer(){

    let moving=false;


    if(
        keys["a"]||
        keys["arrowleft"]
    ){

        player.vx=
            -player.speed;

        player.direction=-1;

        moving=true;

    }

    else if(
        keys["d"]||
        keys["arrowright"]
    ){

        player.vx=
            player.speed;

        player.direction=1;

        moving=true;
    }

    else{

        player.vx*=0.72;
    }


    if(Math.abs(player.vx)<0.05){
        player.vx=0;
    }


    /*
     * Animacja chodzenia
     */

    if(moving && player.grounded){

        player.animation+=0.22;

    }else{

        player.animation*=0.85;
    }


    /*
     * Woda
     */

    const swimming=
        playerInWater();


    if(swimming){

        player.vy+=0.16;

        if(player.vy>3)
            player.vy=3;

    }else{

        player.vy+=GRAVITY;

        if(player.vy>MAX_FALL_SPEED)
            player.vy=MAX_FALL_SPEED;
    }


    /* ruch poziomy */

    let newX=
        player.x+
        player.vx;


    if(
        !playerCollides(
            newX,
            player.y
        )
    ){

        player.x=newX;

    }else{

        player.vx=0;
    }


    /*
     * Ruch pionowy
     */

    let newY=
        player.y+
        player.vy;


    if(
        !playerCollides(
            player.x,
            newY
        )
    ){

        player.y=newY;

        player.grounded=false;

    }else{

        if(player.vy>0){

            player.grounded=true;

            /*
             * Dociśnięcie do góry
             * zapobiega mikro-spadaniu.
             */

            player.y=
                Math.floor(
                    (player.y+
                    player.height)/TILE
                )*TILE-
                player.height-
                0.01;

        }

        player.vy=0;
    }


    /*
     * Kamera
     */

    const targetX=
        player.x+
        player.width/2-
        canvas.width/2;

    const targetY=
        player.y+
        player.height/2-
        canvas.height/2;


    camera.x+=
        (targetX-camera.x)*0.1;

    camera.y+=
        (targetY-camera.y)*0.1;


    const maxCameraX=
        Math.max(
            0,
            WORLD_WIDTH*TILE-
            canvas.width
        );

    const maxCameraY=
        Math.max(
            0,
            WORLD_HEIGHT*TILE-
            canvas.height
        );


    camera.x=
        Math.max(
            0,
            Math.min(
                camera.x,
                maxCameraX
            )
        );


    camera.y=
        Math.max(
            0,
            Math.min(
                camera.y,
                maxCameraY
            )
        );


    /*
     * Zabezpieczenie przed wypadnięciem
     */

    if(
        player.y>
        WORLD_HEIGHT*TILE+300
    ){

        respawn();
    }
}


/* =========================================================
   RYSOWANIE ŚWIATA
========================================================= */

let gameTime=0;


function drawWorld(){

    gameTime+=0.0007;


    /*
     * Dzień/noc
     */

    const cycle=
        (Math.sin(gameTime)+1)/2;


    const skyR=
        Math.floor(
            35+
            cycle*80
        );

    const skyG=
        Math.floor(
            80+
            cycle*130
        );

    const skyB=
        Math.floor(
            140+
            cycle*110
        );


    ctx.fillStyle=
        `rgb(${skyR},${skyG},${skyB})`;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Słońce / księżyc
     */

    const celestialX=
        canvas.width*
        (0.15+cycle*0.7);

    const celestialY=
        100+
        Math.sin(
            cycle*Math.PI
        )*-65;


    ctx.fillStyle=
        cycle>0.5
        ?"#ffe680"
        :"#eeeeff";


    ctx.beginPath();

    ctx.arc(
        celestialX,
        celestialY,
        28,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Widoczne bloki
     */

    const startX=
        Math.max(
            0,
            Math.floor(
                camera.x/TILE
            )-1
        );


    const endX=
        Math.min(
            WORLD_WIDTH,
            Math.ceil(
                (camera.x+
                canvas.width)/TILE
            )+1
        );


    const startY=
        Math.max(
            0,
            Math.floor(
                camera.y/TILE
            )-1
        );


    const endY=
        Math.min(
            WORLD_HEIGHT,
            Math.ceil(
                (camera.y+
                canvas.height)/TILE
            )+1
        );


    for(
        let y=startY;
        y<endY;
        y++
    ){

        for(
            let x=startX;
            x<endX;
            x++
        ){

            drawBlock(
                world[y][x],
                x,
                y
            );
        }
    }


    /*
     * Lekka warstwa nocna
     */

    if(cycle<0.35){

        ctx.fillStyle=
            `rgba(15,25,70,${
                (0.35-cycle)*0.8
            })`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }
}


/* =========================================================
   RYSOWANIE BLOKU
========================================================= */

function drawBlock(
    type,
    tx,
    ty
){

    if(
        type==="air"
    ){
        return;
    }


    const x=
        tx*TILE-
        camera.x;

    const y=
        ty*TILE-
        camera.y;


    if(
        x<-TILE||
        y<-TILE||
        x>canvas.width||
        y>canvas.height
    ){
        return;
    }


    /*
     * WODA
     */

    if(type==="water"){

        ctx.fillStyle=
            BLOCKS.water.color;

        ctx.fillRect(
            x,
            y,
            TILE,
            TILE
        );


        ctx.fillStyle="#73d5fa";


        const wave=
            Math.sin(
                Date.now()*0.004+
                tx*0.7
            )*2;


        ctx.fillRect(
            x,
            y+4+wave,
            TILE,
            3
        );

        return;
    }


    /*
     * POCHODNIA
     */

    if(type==="torch"){

        ctx.fillStyle="#653917";

        ctx.fillRect(
            x+14,
            y+10,
            4,
            20
        );


        ctx.fillStyle="#ff8d00";

        ctx.fillRect(
            x+10,
            y+3,
            12,
            13
        );


        ctx.fillStyle="#fff27b";

        ctx.fillRect(
            x+13,
            y+5,
            6,
            8
        );

        return;
    }


    /*
     * ZWYKŁY BLOK
     */

    ctx.fillStyle=
        BLOCKS[type].color;

    ctx.fillRect(
        x,
        y,
        TILE,
        TILE
    );


    /*
     * TRAWA
     */

    if(type==="grass"){

        ctx.fillStyle="#73d43a";

        ctx.fillRect(
            x,
            y,
            TILE,
            6
        );


        ctx.fillStyle="#3e8d29";

        ctx.fillRect(
            x+6,
            y+4,
            3,
            5
        );

        ctx.fillRect(
            x+22,
            y+3,
            3,
            6
        );
    }


    /*
     * ZIEMIA
     */

    if(type==="dirt"){

        ctx.fillStyle="#70411f";

        const a=
            (tx*13+
             ty*7)%24;

        const b=
            (tx*7+
             ty*11)%23;


        ctx.fillRect(
            x+4+a/4,
            y+8+b/5,
            4,
            4
        );

        ctx.fillRect(
            x+21,
            y+22,
            4,
            4
        );
    }


    /*
     * KAMIEŃ
     */

    if(type==="stone"){

        ctx.fillStyle="#5f5f5f";

        ctx.fillRect(
            x+5,
            y+7,
            6,
            5
        );

        ctx.fillRect(
            x+20,
            y+20,
            6,
            5
        );
    }


    /*
     * DREWNO
     */

    if(type==="wood"){

        ctx.fillStyle="#603715";

        ctx.fillRect(
            x+12,
            y,
            5,
            TILE
        );

        ctx.fillStyle="#b16b35";

        ctx.fillRect(
            x+20,
            y+7,
            3,
            5
        );
    }


    /*
     * LIŚCIE
     */

    if(type==="leaves"){

        ctx.fillStyle="#1e782b";

        ctx.fillRect(
            x+5,
            y+7,
            7,
            7
        );

        ctx.fillRect(
            x+20,
            y+17,
            7,
            6
        );
    }


    /*
     * PIACH
     */

    if(type==="sand"){

        ctx.fillStyle="#b8a461";

        ctx.fillRect(
            x+6,
            y+9,
            3,
            3
        );

        ctx.fillRect(
            x+21,
            y+21,
            3,
            3
        );
    }
}


/* =========================================================
   GRACZ
========================================================= */

function drawPlayer(){

    const x=
        player.x-
        camera.x;

    const y=
        player.y-
        camera.y;


    let leg=0;


    if(player.grounded){

        leg=
            Math.sin(
                player.animation
            )*4;
    }


    ctx.save();


    if(player.direction<0){

        ctx.translate(
            x+player.width,
            0
        );

        ctx.scale(
            -1,
            1
        );


        drawCharacter(
            0,
            y,
            leg
        );

    }else{

        drawCharacter(
            x,
            y,
            leg
        );
    }


    ctx.restore();
}


function drawCharacter(
    x,
    y,
    leg
){

    /*
     * nogi
     */

    ctx.fillStyle="#292929";

    ctx.fillRect(
        x+4,
        y+29+leg,
        6,
        14
    );

    ctx.fillRect(
        x+13,
        y+29-leg,
        6,
        14
    );


    /*
     * ciało
     */

    ctx.fillStyle="#2776d8";

    ctx.fillRect(
        x+3,
        y+14,
        17,
        18
    );


    /*
     * ręce
     */

    ctx.fillStyle="#efb985";

    ctx.fillRect(
        x-2,
        y+16-leg,
        5,
        15
    );

    ctx.fillRect(
        x+20,
        y+16+leg,
        5,
        15
    );


    /*
     * głowa
     */

    ctx.fillStyle="#efb985";

    ctx.fillRect(
        x+2,
        y,
        20,
        17
    );


    /*
     * włosy
     */

    ctx.fillStyle="#482a18";

    ctx.fillRect(
        x+2,
        y,
        20,
        5
    );

    ctx.fillRect(
        x+2,
        y+4,
        4,
        6
    );


    /*
     * oczy
     */

    ctx.fillStyle="#111";

    ctx.fillRect(
        x+7,
        y+8,
        3,
        3
    );

    ctx.fillRect(
        x+15,
        y+8,
        3,
        3
    );
}


/* =========================================================
   INTERAKCJA Z BLOKAMI
========================================================= */

function getMouseTile(event){

    const rect=
        canvas.getBoundingClientRect();


    const screenX=
        event.clientX-
        rect.left;


    const screenY=
        event.clientY-
        rect.top;


    const worldX=
        screenX+
        camera.x;


    const worldY=
        screenY+
        camera.y;


    return{

        x:Math.floor(
            worldX/TILE
        ),

        y:Math.floor(
            worldY/TILE
        )
    };
}


function tileInsideWorld(
    x,
    y
){

    return(
        x>=0 &&
        x<WORLD_WIDTH &&
        y>=0 &&
        y<WORLD_HEIGHT
    );
}


function tileTouchesPlayer(
    tx,
    ty
){

    const bx=tx*TILE;
    const by=ty*TILE;


    return(

        bx<
        player.x+
        player.width &&

        bx+TILE>
        player.x &&

        by<
        player.y+
        player.height &&

        by+TILE>
        player.y
    );
}


function canReachTile(
    tx,
    ty
){

    /*
     * Gracz nie może niszczyć
     * bloków z całej mapy.
     */

    const centerX=
        player.x+
        player.width/2;

    const centerY=
        player.y+
        player.height/2;


    const tileCenterX=
        tx*TILE+
        TILE/2;

    const tileCenterY=
        ty*TILE+
        TILE/2;


    const dx=
        tileCenterX-centerX;

    const dy=
        tileCenterY-centerY;


    return(
        Math.sqrt(dx*dx+dy*dy)
        <=
        TILE*5
    );
}


function mineBlock(
    tx,
    ty
){

    if(
        !tileInsideWorld(tx,ty)
    ){
        return;
    }


    if(
        !canReachTile(tx,ty)
    ){
        return;
    }


    const type=
        world[ty][tx];


    if(
        type==="air"||
        type==="water"||
        type==="leaves"
    ){
        return;
    }


    world[ty][tx]="air";


    /*
     * Drop przedmiotu
     */

    if(
        type==="grass"||
        type==="dirt"
    ){

        inventory.dirt++;
    }

    else if(type==="stone"){

        inventory.stone++;
    }

    else if(type==="wood"){

        inventory.wood++;
    }

    else if(type==="sand"){

        inventory.sand++;
    }


    updateHotbar();
}


function placeBlock(
    tx,
    ty
){

    if(
        !tileInsideWorld(tx,ty)
    ){
        return;
    }


    if(
        !canReachTile(tx,ty)
    ){
        return;
    }


    /*
     * Nie pozwalamy stawiać
     * bloku w graczu.
     */

    if(
        tileTouchesPlayer(tx,ty)
    ){
        return;
    }


    /*
     * Można stawiać tylko
     * w pustym miejscu.
     */

    if(
        world[ty][tx]!=="air"
    ){
        return;
    }


    const type=
        selectedBlock;


    if(
        !inventory[type] ||
        inventory[type]<=0
    ){

        showMessage(
            "Brak tego bloku!"
        );

        return;
    }


    world[ty][tx]=type;

    inventory[type]--;

    updateHotbar();
}


/* =========================================================
   MYSZKA
========================================================= */

canvas.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


canvas.addEventListener(
    "mousedown",
    e=>{

        if(
            e.button!==0 &&
            e.button!==2
        ){
            return;
        }


        const tile=
            getMouseTile(e);


        if(e.button===0){

            mineBlock(
                tile.x,
                tile.y
            );
        }


        if(e.button===2){

            placeBlock(
                tile.x,
                tile.y
            );
        }
    }
);


/* =========================================================
   DOTYK — KOPANIE / STAWIANIE
========================================================= */

let touchStart=null;


canvas.addEventListener(
    "touchstart",
    e=>{

        /*
         * Jeżeli dotykamy canvasu,
         * zapamiętujemy pozycję.
         */

        if(e.touches.length!==1)
            return;


        const touch=e.touches[0];


        touchStart={
            x:touch.clientX,
            y:touch.clientY
        };
    },
    {passive:true}
);


canvas.addEventListener(
    "touchend",
    e=>{

        if(!touchStart)
            return;


        const touch=
            e.changedTouches[0];


        const dx=
            touch.clientX-
            touchStart.x;

        const dy=
            touch.clientY-
            touchStart.y;


        /*
         * Tylko krótki tap.
         * Przy przesuwaniu palcem
         * niczego nie niszczymy.
         */

        if(
            Math.abs(dx)<12 &&
            Math.abs(dy)<12
        ){

            const fakeEvent={
                clientX:touch.clientX,
                clientY:touch.clientY
            };


            const tile=
                getMouseTile(fakeEvent);


            mineBlock(
                tile.x,
                tile.y
            );
        }


        touchStart=null;
    },
    {passive:true}
);


/* =========================================================
   ZDROWIE
========================================================= */

function updateHealth(){

    const percent=
        Math.max(
            0,
            Math.min(
                100,
                player.health
            )
        );


    document.getElementById(
        "healthBar"
    ).style.width=
        percent+"%";


    document.getElementById(
        "healthText"
    ).textContent=
        Math.round(player.health)+
        " / "+
        player.maxHealth;
}


function damage(amount){

    player.health=
        Math.max(
            0,
            player.health-amount
        );


    updateHealth();


    if(
        player.health<=0
    ){

        respawn();
    }
}


function respawn(){

    placePlayerAtSpawn();

    player.health=
        player.maxHealth;

    updateHealth();

    showMessage(
        "💀 Odrodziłeś się!"
    );
}


/* =========================================================
   CRAFTING
========================================================= */

const crafting=
    document.getElementById(
        "crafting"
    );


document.getElementById(
    "craftButton"
).addEventListener(
    "click",
    ()=>{

        crafting.style.display=
            crafting.style.display==="block"
            ?"none"
            :"block";
    }
);


document
.querySelectorAll(".recipe")
.forEach(recipe=>{

    recipe.addEventListener(
        "click",
        ()=>{

            const type=
                recipe.dataset.recipe;


            if(
                type==="planks"
            ){

                if(
                    inventory.wood>=2
                ){

                    inventory.wood-=2;

                    /*
                     * Deski wykorzystujemy
                     * jako zwykłe drewno,
                     * żeby nie tworzyć kolejnego
                     * rodzaju itemu.
                     */

                    inventory.wood+=8;

                    showMessage(
                        "🪵 Zrobiono deski!"
                    );

                }else{

                    showMessage(
                        "Brakuje drewna!"
                    );
                }
            }


            if(
                type==="torch"
            ){

                if(
                    inventory.wood>=1 &&
                    inventory.stone>=1
                ){

                    inventory.wood--;
                    inventory.stone--;

                    inventory.torch+=4;

                    showMessage(
                        "🔥 Zrobiono 4 pochodnie!"
                    );

                }else{

                    showMessage(
                        "Brakuje surowców!"
                    );
                }
            }


            if(
                type==="pickaxe"
            ){

                if(
                    inventory.wood>=5 &&
                    inventory.stone>=3
                ){

                    inventory.wood-=5;
                    inventory.stone-=3;

                    showMessage(
                        "⛏️ Stworzono kilof!"
                    );

                }else{

                    showMessage(
                        "Brakuje surowców!"
                    );
                }
            }


            updateHotbar();
        }
    );
});


/* =========================================================
   ZAPIS
========================================================= */

function saveGame(){

    try{

        const data={

            version:3,

            worldSeed,

            world,

            player:{
                x:player.x,
                y:player.y,
                health:player.health
            },

            inventory,

            selectedBlock
        };


        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(data)
        );


        showMessage(
            "💾 Świat zapisany!"
        );

    }catch(error){

        console.error(
            "Błąd zapisu:",
            error
        );

        showMessage(
            "❌ Nie udało się zapisać!"
        );
    }
}


function loadGame(){

    try{

        const raw=
            localStorage.getItem(
                SAVE_KEY
            );


        if(!raw){
            return false;
        }


        const data=
            JSON.parse(raw);


        /*
         * Sprawdzamy podstawowe dane,
         * zanim użyjemy zapisu.
         */

        if(
            !data ||
            !Array.isArray(data.world)
        ){
            return false;
        }


        if(
            data.world.length!==WORLD_HEIGHT
        ){
            return false;
        }


        if(
            !data.world.every(
                row=>
                    Array.isArray(row)&&
                    row.length===WORLD_WIDTH
            )
        ){
            return false;
        }


        world=data.world;

        worldSeed=
            Number.isFinite(
                data.worldSeed
            )
            ?data.worldSeed
            :worldSeed;


        if(data.player){

            if(
                Number.isFinite(
                    data.player.x
                )
            ){
                player.x=
                    data.player.x;
            }

            if(
                Number.isFinite(
                    data.player.y
                )
            ){
                player.y=
                    data.player.y;
            }

            if(
                Number.isFinite(
                    data.player.health
                )
            ){
                player.health=
                    Math.max(
                        0,
                        Math.min(
                            100,
                            data.player.health
                        )
                    );
            }
        }


        if(
            data.inventory &&
            typeof data.inventory==="object"
        ){

            for(
                const type of
                [
                    "dirt",
                    "stone",
                    "wood",
                    "sand",
                    "torch"
                ]
            ){

                const amount=
                    Number(
                        data.inventory[type]
                    );


                if(
                    Number.isFinite(amount)&&
                    amount>=0
                ){

                    inventory[type]=
                        Math.floor(amount);
                }
            }
        }


        if(
            typeof data.selectedBlock==="string" &&
            inventory[data.selectedBlock]!==undefined
        ){

            selectedBlock=
                data.selectedBlock;
        }


        /*
         * Jeżeli zapisany gracz
         * znajduje się wewnątrz bloku,
         * przenosimy go na spawn.
         */

        if(
            playerCollides(
                player.x,
                player.y
            )
        ){

            placePlayerAtSpawn();
        }


        updateHotbar();
        updateHealth();


        showMessage(
            "📂 Wczytano zapis!"
        );


        return true;

    }catch(error){

        console.error(
            "Błąd wczytywania:",
            error
        );

        return false;
    }
}


document.getElementById(
    "saveButton"
).addEventListener(
    "click",
    saveGame
);


/* =========================================================
   AUTOMATYCZNY ZAPIS
========================================================= */

setInterval(
    ()=>{
        saveGameSilently();
    },
    30000
);


function saveGameSilently(){

    try{

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify({

                version:3,

                worldSeed,

                world,

                player:{
                    x:player.x,
                    y:player.y,
                    health:player.health
                },

                inventory,

                selectedBlock
            })
        );

    }catch(error){

        console.warn(
            "Automatyczny zapis nieudany."
        );
    }
}


/* =========================================================
   WIADOMOŚCI
========================================================= */

let messageTimeout=null;


function showMessage(text){

    const element=
        document.getElementById(
            "message"
        );


    element.textContent=text;

    element.style.opacity="1";


    clearTimeout(
        messageTimeout
    );


    messageTimeout=
        setTimeout(
            ()=>{
                element.style.opacity="0";
            },
            1800
        );
}


/* =========================================================
   START
========================================================= */

loadGame();

updateHotbar();

updateHealth();


/* =========================================================
   GŁÓWNA PĘTLA
========================================================= */

function gameLoop(){

    updatePlayer();

    drawWorld();

    drawPlayer();

    requestAnimationFrame(
        gameLoop
    );
}


gameLoop();
