<script>

"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    ctx.imageSmoothingEnabled=false;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   USTAWIENIA ŚWIATA
===================================================== */

const TILE=32;

const WORLD_W=400;
const WORLD_H=70;


/* =====================================================
   BLOKI
===================================================== */

const BLOCK={

    air:{
        solid:false,
        color:"transparent"
    },

    grass:{
        solid:true,
        color:"#4fa331"
    },

    dirt:{
        solid:true,
        color:"#87502a"
    },

    stone:{
        solid:true,
        color:"#707070"
    },

    wood:{
        solid:true,
        color:"#92552b"
    },

    leaves:{
        solid:false,
        color:"#29933a"
    },

    sand:{
        solid:true,
        color:"#dbc477"
    },

    water:{
        solid:false,
        color:"#35a9df"
    }
};


/* =====================================================
   ŚWIAT
===================================================== */

let world=[];

let seed=
    Math.floor(
        Math.random()*100000
    );


function createWorld(){

    world=[];

    for(let y=0;y<WORLD_H;y++){

        world[y]=[];

        for(let x=0;x<WORLD_W;x++){

            world[y][x]="air";
        }
    }


    /* teren */

    for(let x=0;x<WORLD_W;x++){

        let ground=
            Math.floor(
                27+
                Math.sin(x*0.05)*3+
                Math.sin(x*0.018)*5
            );

        ground=Math.max(
            18,
            Math.min(
                38,
                ground
            )
        );


        for(let y=ground;y<WORLD_H;y++){

            if(y===ground){

                world[y][x]="grass";

            }else if(y<ground+5){

                world[y][x]="dirt";

            }else{

                world[y][x]="stone";
            }
        }
    }


    /* drzewa */

    for(
        let x=8;
        x<WORLD_W-8;
        x++
    ){

        if(
            Math.random()<0.045
        ){

            let ground=
                findGround(x);

            let height=
                4+
                Math.floor(
                    Math.random()*2
                );


            for(
                let y=ground-1;
                y>=ground-height;
                y--
            ){

                if(y>=0){

                    world[y][x]="wood";
                }
            }


            let top=
                ground-height;


            for(
                let y=top-2;
                y<=top+1;
                y++
            ){

                for(
                    let xx=x-2;
                    xx<=x+2;
                    xx++
                ){

                    if(
                        xx>=0 &&
                        xx<WORLD_W &&
                        y>=0 &&
                        y<WORLD_H
                    ){

                        if(
                            Math.abs(xx-x)+
                            Math.abs(y-top)
                            <=3
                        ){

                            if(
                                world[y][xx]==="air"
                            ){

                                world[y][xx]="leaves";
                            }
                        }
                    }
                }
            }
        }
    }


    /* małe jeziora */

    for(let i=0;i<12;i++){

        let x=
            10+
            Math.floor(
                Math.random()*
                (WORLD_W-20)
            );


        let width=
            2+
            Math.floor(
                Math.random()*3
            );


        for(
            let xx=x-width;
            xx<=x+width;
            xx++
        ){

            if(
                xx<1 ||
                xx>=WORLD_W-1
            )continue;


            let ground=
                findGround(xx);


            world[ground][xx]="water";
        }
    }


    /* kilka płaskich miejsc */

    for(
        let x=8;
        x<18;
        x++
    ){

        let ground=
            findGround(x);

        world[ground][x]="grass";
    }
}


/* =====================================================
   ZNAJDOWANIE ZIEMI
===================================================== */

function findGround(x){

    if(
        x<0 ||
        x>=WORLD_W
    ){

        return 30;
    }


    for(
        let y=0;
        y<WORLD_H;
        y++
    ){

        let type=
            world[y][x];


        if(
            type!=="air" &&
            type!=="leaves" &&
            type!=="water"
        ){

            return y;
        }
    }


    return 30;
}


/* =====================================================
   START ŚWIATA
===================================================== */

createWorld();


/* =====================================================
   GRACZ
===================================================== */

const player={

    x:12*TILE,

    y:0,

    width:22,

    height:42,

    vx:0,

    vy:0,

    speed:3.4,

    jump:9.5,

    grounded:false,

    direction:1,

    walkAnimation:0,

    health:100
};


/* ustaw gracza */

function spawnPlayer(){

    const ground=
        findGround(12);


    player.x=
        12*TILE+
        5;


    player.y=
        ground*TILE-
        player.height;


    player.vx=0;
    player.vy=0;
}


spawnPlayer();


/* =====================================================
   KAMERA
===================================================== */

const camera={
    x:0,
    y:0
};


/* =====================================================
   INPUT
===================================================== */

const keys={};


window.addEventListener(
    "keydown",
    function(e){

        let key=
            e.key.toLowerCase();

        keys[key]=true;


        if(
            key===" " ||
            key==="w" ||
            key==="arrowup"
        ){

            e.preventDefault();

            jump();
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ]=false;
    }
);


/* =====================================================
   SKOK
===================================================== */

function jump(){

    if(
        player.grounded
    ){

        player.vy=
            -player.jump;

        player.grounded=false;
    }
}


/* =====================================================
   TELEFON
===================================================== */

function hold(
    element,
    key
){

    function start(e){

        e.preventDefault();

        keys[key]=true;
    }

    function end(e){

        e.preventDefault();

        keys[key]=false;
    }


    element.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        end,
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        end,
        {passive:false}
    );


    element.addEventListener(
        "mousedown",
        start
    );

    window.addEventListener(
        "mouseup",
        end
    );
}


hold(
    document.getElementById("left"),
    "arrowleft"
);

hold(
    document.getElementById("right"),
    "arrowright"
);


document
.getElementById("jump")
.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        jump();
    },
    {passive:false}
);


document
.getElementById("jump")
.addEventListener(
    "mousedown",
    function(){

        jump();
    }
);


/* =====================================================
   KOLIZJE
===================================================== */

function solidAtPixel(
    px,
    py
){

    let tx=
        Math.floor(px/TILE);

    let ty=
        Math.floor(py/TILE);


    /*
     * Granica świata jest ścianą.
     */

    if(
        tx<0 ||
        tx>=WORLD_W ||
        ty<0
    ){

        return true;
    }


    /*
     * Pod światem jest podłoże.
     */

    if(
        ty>=WORLD_H
    ){

        return true;
    }


    let type=
        world[ty][tx];


    return(
        BLOCK[type] &&
        BLOCK[type].solid
    );
}


function playerCollision(
    x,
    y
){

    const p=2;


    return(

        solidAtPixel(
            x+p,
            y+p
        )

        ||

        solidAtPixel(
            x+
            player.width-p,
            y+p
        )

        ||

        solidAtPixel(
            x+p,
            y+
            player.height-p
        )

        ||

        solidAtPixel(
            x+
            player.width-p,
            y+
            player.height-p
        )
    );
}


/* =====================================================
   UPDATE GRACZA
===================================================== */

function updatePlayer(){

    let moving=false;


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        player.vx=
            -player.speed;

        player.direction=-1;

        moving=true;

    }else if(
        keys["d"] ||
        keys["arrowright"]
    ){

        player.vx=
            player.speed;

        player.direction=1;

        moving=true;

    }else{

        player.vx*=0.75;
    }


    if(
        Math.abs(player.vx)<0.05
    ){

        player.vx=0;
    }


    if(
        moving &&
        player.grounded
    ){

        player.walkAnimation+=0.25;

    }else{

        player.walkAnimation*=0.8;
    }


    /* grawitacja */

    player.vy+=0.45;


    if(
        player.vy>11
    ){

        player.vy=11;
    }


    /* ruch X */

    let newX=
        player.x+
        player.vx;


    if(
        !playerCollision(
            newX,
            player.y
        )
    ){

        player.x=newX;

    }else{

        player.vx=0;
    }


    /* ruch Y */

    let newY=
        player.y+
        player.vy;


    if(
        !playerCollision(
            player.x,
            newY
        )
    ){

        player.y=newY;

        player.grounded=false;

    }else{

        if(
            player.vy>0
        ){

            player.grounded=true;

            /*
             * Ustawienie gracza dokładnie
             * na powierzchni.
             */

            let tileBottom=
                Math.floor(
                    (
                        player.y+
                        player.height
                    )/TILE
                );


            player.y=
                tileBottom*TILE-
                player.height-
                0.01;
        }


        player.vy=0;
    }


    /* kamera */

    let targetX=
        player.x+
        player.width/2-
        canvas.width/2;


    let targetY=
        player.y+
        player.height/2-
        canvas.height/2;


    camera.x+=
        (
            targetX-
            camera.x
        )*0.1;


    camera.y+=
        (
            targetY-
            camera.y
        )*0.1;


    let maxX=
        Math.max(
            0,
            WORLD_W*TILE-
            canvas.width
        );


    let maxY=
        Math.max(
            0,
            WORLD_H*TILE-
            canvas.height
        );


    camera.x=
        Math.max(
            0,
            Math.min(
                camera.x,
                maxX
            )
        );


    camera.y=
        Math.max(
            0,
            Math.min(
                camera.y,
                maxY
            )
        );


    /*
     * Awaryjny respawn.
     */

    if(
        player.y>
        WORLD_H*TILE+200
    ){

        spawnPlayer();
    }
}


/* =====================================================
   RYSOWANIE NIEBA
===================================================== */

function drawSky(){

    ctx.fillStyle="#76caff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* chmury */

    ctx.fillStyle=
        "rgba(255,255,255,.7)";


    drawCloud(
        150-camera.x*0.15,
        100
    );

    drawCloud(
        550-camera.x*0.1,
        150
    );

    drawCloud(
        900-camera.x*0.12,
        80
    );
}


function drawCloud(
    x,
    y
){

    ctx.fillRect(
        x,
        y,
        90,
        20
    );

    ctx.fillRect(
        x+20,
        y-12,
        40,
        25
    );

    ctx.fillRect(
        x+55,
        y-6,
        35,
        20
    );
}


/* =====================================================
   RYSOWANIE ŚWIATA
===================================================== */

function drawWorld(){

    drawSky();


    const startX=
        Math.max(
            0,
            Math.floor(
                camera.x/TILE
            )-1
        );


    const endX=
        Math.min(
            WORLD_W,
            Math.ceil(
                (
                    camera.x+
                    canvas.width
                )/TILE
            )+1
        );


    const startY=
        Math.max(
            0,
            Math.floor(
                camera.y/TILE
            )-1
        );


    const endY=
        Math.min(
            WORLD_H,
            Math.ceil(
                (
                    camera.y+
                    canvas.height
                )/TILE
            )+1
        );


    for(
        let y=startY;
        y<endY;
        y++
    ){

        for(
            let x=startX;
            x<endX;
            x++
        ){

            drawBlock(
                world[y][x],
                x,
                y
            );
        }
    }
}


/* =====================================================
   RYSOWANIE BLOKU
===================================================== */

function drawBlock(
    type,
    tx,
    ty
){

    if(
        type==="air"
    ){

        return;
    }


    const x=
        tx*TILE-
        camera.x;

    const y=
        ty*TILE-
        camera.y;


    if(
        x<-TILE ||
        y<-TILE ||
        x>canvas.width ||
        y>canvas.height
    ){

        return;
    }


    /* woda */

    if(
        type==="water"
    ){

        ctx.fillStyle=
            "#35a9df";

        ctx.fillRect(
            x,
            y,
            TILE,
            TILE
        );


        ctx.fillStyle=
            "#78d8fa";


        ctx.fillRect(
            x,
            y+5+
            Math.sin(
                Date.now()*0.004+
                tx
            )*2,
            TILE,
            3
        );


        return;
    }


    /* zwykły blok */

    ctx.fillStyle=
        BLOCK[type].color;


    ctx.fillRect(
        x,
        y,
        TILE,
        TILE
    );


    /* trawa */

    if(
        type==="grass"
    ){

        ctx.fillStyle=
            "#73d63c";

        ctx.fillRect(
            x,
            y,
            TILE,
            6
        );


        ctx.fillStyle=
            "#347f26";

        ctx.fillRect(
            x+6,
            y+5,
            3,
            5
        );

        ctx.fillRect(
            x+21,
            y+3,
            3,
            6
        );
    }


    /* ziemia */

    if(
        type==="dirt"
    ){

        ctx.fillStyle=
            "#70401f";

        ctx.fillRect(
            x+6,
            y+9,
            4,
            4
        );

        ctx.fillRect(
            x+21,
            y+21,
            4,
            4
        );
    }


    /* kamień */

    if(
        type==="stone"
    ){

        ctx.fillStyle=
            "#5d5d5d";

        ctx.fillRect(
            x+5,
            y+7,
            6,
            5
        );

        ctx.fillRect(
            x+20,
            y+20,
            5,
            5
        );
    }


    /* drewno */

    if(
        type==="wood"
    ){

        ctx.fillStyle=
            "#613716";

        ctx.fillRect(
            x+13,
            y,
            5,
            TILE
        );
    }


    /* liście */

    if(
        type==="leaves"
    ){

        ctx.fillStyle=
            "#1e762a";

        ctx.fillRect(
            x+5,
            y+7,
            8,
            7
        );

        ctx.fillRect(
            x+20,
            y+18,
            7,
            6
        );
    }


    /* piasek */

    if(
        type==="sand"
    ){

        ctx.fillStyle=
            "#b6a25d";

        ctx.fillRect(
            x+6,
            y+9,
            3,
            3
        );

        ctx.fillRect(
            x+21,
            y+21,
            3,
            3
        );
    }
}


/* =====================================================
   RYSOWANIE POSTACI
===================================================== */

function drawPlayer(){

    const x=
        player.x-
        camera.x;

    const y=
        player.y-
        camera.y;


    let walk=0;


    if(
        player.grounded
    ){

        walk=
            Math.sin(
                player.walkAnimation
            )*4;
    }


    ctx.save();


    if(
        player.direction<0
    ){

        ctx.translate(
            x+
            player.width,
            0
        );

        ctx.scale(
            -1,
            1
        );


        drawCharacter(
            0,
            y,
            walk
        );

    }else{

        drawCharacter(
            x,
            y,
            walk
        );
    }


    ctx.restore();
}


function drawCharacter(
    x,
    y,
    walk
){

    /* nogi */

    ctx.fillStyle="#292929";


    ctx.fillRect(
        x+4,
        y+29+walk,
        6,
        14
    );


    ctx.fillRect(
        x+13,
        y+29-walk,
        6,
        14
    );


    /* ciało */

    ctx.fillStyle="#2878d8";


    ctx.fillRect(
        x+3,
        y+14,
        17,
        18
    );


    /* ręce */

    ctx.fillStyle="#efb985";


    ctx.fillRect(
        x-2,
        y+16-walk,
        5,
        15
    );


    ctx.fillRect(
        x+20,
        y+16+walk,
        5,
        15
    );


    /* głowa */

    ctx.fillStyle="#efb985";


    ctx.fillRect(
        x+2,
        y,
        20,
        17
    );


    /* włosy */

    ctx.fillStyle="#492b18";


    ctx.fillRect(
        x+2,
        y,
        20,
        5
    );


    ctx.fillRect(
        x+2,
        y+4,
        4,
        6
    );


    /* oczy */

    ctx.fillStyle="#111";


    ctx.fillRect(
        x+7,
        y+8,
        3,
        3
    );


    ctx.fillRect(
        x+15,

    );

/* =====================================================
   ODLEGŁOŚĆ OD BLOKU
===================================================== */

function canReach(
    tx,
    ty
){

    let px=
        player.x+
        player.width/2;

    let py=
        player.y+
        player.height/2;


    let bx=
        tx*TILE+
        TILE/2;

    let by=
        ty*TILE+
        TILE/2;


    let dx=bx-px;
    let dy=by-py;


    return(
        Math.sqrt(
            dx*dx+
            dy*dy
        )
        <=
        TILE*5
    );
}


/* =====================================================
   MYSZKA
===================================================== */

function mouseTile(e){

    const rect=
        canvas.getBoundingClientRect();


    let x=
        e.clientX-
        rect.left+
        camera.x;


    let y=
        e.clientY-
        rect.top+
        camera.y;


    return{

        x:Math.floor(
            x/TILE
        ),

        y:Math.floor(
            y/TILE
        )
    };
}


canvas.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


canvas.addEventListener(
    "mousedown",
    e=>{

        let tile=
            mouseTile(e);


        if(
            tile.x<0 ||
            tile.x>=WORLD_W ||
            tile.y<0 ||
            tile.y>=WORLD_H
        ){

            return;
        }


        if(
            !canReach(
                tile.x,
                tile.y
            )
        ){

            return;
        }


        /* LPM — kopanie */

        if(
            e.button===0
        ){

            let type=
                world[tile.y][tile.x];


            if(
                type==="air" ||
                type==="water" ||
                type==="leaves"
            ){

                return;
            }


            world[tile.y][tile.x]="air";


            if(
                type==="grass" ||
                type==="dirt"
            ){

                inventory.dirt++;
            }

            if(
                type==="stone"
            ){

                inventory.stone++;
            }

            if(
                type==="wood"
            ){

                inventory.wood++;
            }

            if(
                type==="sand"
            ){

                inventory.sand++;
            }


            updateHotbar();
        }


        /* PPM — stawianie */

        if(
            e.button===2
        ){

            if(
                world[tile.y][tile.x]!=="air"
            ){

                return;
            }


            if(
                inventory[selectedBlock]<=0
            ){

                showMessage(
                    "Brak bloku!"
                );

                return;
            }


            /*
             * Nie pozwalamy stawiać
             * bloku w środku postaci.
             */

            let bx=
                tile.x*TILE;

            let by=
                tile.y*TILE;


            let overlap=
                bx<
                player.x+
                player.width &&

                bx+TILE>
                player.x &&

                by<
                player.y+
                player.height &&

                by+TILE>
                player.y;


            if(overlap){

                return;
            }


            world[tile.y][tile.x]=
                selectedBlock;


            inventory[selectedBlock]--;


            updateHotbar();
        }
    }
);

/* =====================================================
   WCZYTYWANIE
===================================================== */

function loadGame(){

    try{

        let raw=
            localStorage.getItem(
                SAVE_KEY
            );


        if(!raw){

            return;
        }


        let data=
            JSON.parse(raw);


        /*
         * Sprawdzamy, czy świat
         * naprawdę istnieje.
         */

        if(
            !data ||
            !Array.isArray(data.world)
        ){

            return;
        }


        if(
            data.world.length!==WORLD_H
        ){

            return;
        }


        for(
            let y=0;
            y<WORLD_H;
            y++
        ){

            if(
                !Array.isArray(
                    data.world[y]
                ) ||
                data.world[y].length!==WORLD_W
            ){

                return;
            }
        }


        world=data.world;


        if(
            data.player &&
            Number.isFinite(
                data.player.x
            ) &&
            Number.isFinite(
                data.player.y
            )
        ){

            player.x=data.player.x;
            player.y=data.player.y;
        }


        if(
            data.inventory
        ){

            for(
                let type of
                [
                    "dirt",
                    "stone",
                    "wood",
                    "sand"
                ]
            ){

                if(
                    Number.isFinite(
                        data.inventory[type]
                    )
                ){

                    inventory[type]=
                        Math.max(
                            0,
                            Math.floor(
                                data.inventory[type]
                            )
                        );
                }
            }
        }


        if(
            typeof data.selected==="string" &&
            inventory[data.selected]!==undefined
        ){

            selectedBlock=
                data.selected;
        }


        /*
         * Jeżeli zapisany gracz
         * znalazł się w bloku,
         * resetujemy jego pozycję.
         */

        if(
            playerCollision(
                player.x,
                player.y
            )
        ){

            spawnPlayer();
        }


    }catch(error){

        console.warn(
            "Stary zapis pominięty.",
            error
        );
    }
}


loadGame();
