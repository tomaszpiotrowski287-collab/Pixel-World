<script>

/* =====================================================
   PIXEL WORLD 2.0
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const TILE=32;
const WORLD_W=700;
const WORLD_H=100;

const blocks={
    air:{solid:false,color:null},
    grass:{solid:true,color:"#55a832"},
    dirt:{solid:true,color:"#8a542b"},
    stone:{solid:true,color:"#777"},
    wood:{solid:true,color:"#92552a"},
    leaves:{solid:false,color:"#2e9638"},
    sand:{solid:true,color:"#dbc67d"},
    water:{solid:false,color:"#35a9df"},
    torch:{solid:false,color:"#ffb52e"}
};

let world=[];
let seed=Math.random()*10000;

/* =====================================================
   INVENTORY
===================================================== */

let inventory={
    dirt:20,
    stone:10,
    wood:10,
    sand:10,
    torch:4
};

let selected="dirt";

function updateHotbar(){

    document.querySelectorAll(".slot").forEach(slot=>{
        const type=slot.dataset.block;
        slot.querySelector("span").textContent=inventory[type]||0;

        slot.classList.toggle(
            "selected",
            type===selected
        );
    });
}

document.querySelectorAll(".slot").forEach(slot=>{
    slot.addEventListener("click",()=>{
        selected=slot.dataset.block;
        updateHotbar();
    });
});

/* =====================================================
   WORLD GENERATION
===================================================== */

function noise(x){
    return Math.sin(x*.055+seed)*3+
           Math.sin(x*.019+seed*.4)*6+
           Math.sin(x*.009+seed*.2)*9;
}

function surface(x){
    return Math.floor(31+noise(x));
}

function generateWorld(){

    world=Array.from(
        {length:WORLD_H},
        ()=>Array(WORLD_W).fill("air")
    );

    for(let x=0;x<WORLD_W;x++){

        let ground=surface(x);

        for(let y=ground;y<WORLD_H;y++){

            if(y===ground){
                world[y][x]="grass";
            }
            else if(y<ground+6){
                world[y][x]="dirt";
            }
            else{
                world[y][x]="stone";
            }
        }
    }

    /* jaskinie */

    for(let i=0;i<220;i++){

        let cx=Math.floor(
            Math.random()*WORLD_W
        );

        let cy=Math.floor(
            42+Math.random()*40
        );

        let rx=2+Math.random()*6;
        let ry=1+Math.random()*4;

        for(let y=cy-ry;y<=cy+ry;y++){
            for(let x=cx-rx;x<=cx+rx;x++){

                if(
                    x>=0&&
                    x<WORLD_W&&
                    y>=0&&
                    y<WORLD_H
                ){

                    let dx=(x-cx)/rx;
                    let dy=(y-cy)/ry;

                    if(dx*dx+dy*dy<1){
                        world[y][x]="air";
                    }
                }
            }
        }
    }

    /* drzewa */

    for(let x=5;x<WORLD_W-5;x++){

        if(Math.random()<.045){

            let g=surface(x);

            let h=4+Math.floor(
                Math.random()*3
            );

            for(let y=g-1;y>=g-h;y--){
                if(y>=0)world[y][x]="wood";
            }

            for(let yy=g-h-2;yy<=g-h+1;yy++){

                for(let xx=x-2;xx<=x+2;xx++){

                    if(
                        xx>=0&&
                        xx<WORLD_W&&
                        yy>=0&&
                        yy<WORLD_H
                    ){

                        let d=
                            Math.abs(xx-x)+
                            Math.abs(yy-(g-h));

                        if(d<4){
                            world[yy][xx]="leaves";
                        }
                    }
                }
            }
        }
    }

    /* jeziora */

    for(let i=0;i<18;i++){

        let x=10+
            Math.floor(
                Math.random()*(WORLD_W-20)
            );

        let width=2+
            Math.floor(Math.random()*4);

        for(let xx=x-width;xx<=x+width;xx++){

            if(xx<0||xx>=WORLD_W)continue;

            let g=surface(xx);

            world[g][xx]="water";

            if(g+1<WORLD_H)
                world[g+1][xx]="water";
        }
    }
}

generateWorld();

/* =====================================================
   PLAYER
===================================================== */

const player={
    x:10*TILE,
    y:20*TILE,
    w:22,
    h:43,
    vx:0,
    vy:0,
    speed:3.5,
    jump:10,
    grounded:false,
    direction:1,
    anim:0,
    health:100,
    maxHealth:100
};

/* =====================================================
   CAMERA
===================================================== */

const camera={
    x:0,
    y:0
};

/* =====================================================
   INPUT
===================================================== */

const keys={};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(
        e.key===" "||
        e.key==="ArrowUp"||
        e.key.toLowerCase()==="w"
    ){
        jump();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function jump(){

    if(player.grounded){
        player.vy=-player.jump;
        player.grounded=false;
    }
}

/* =====================================================
   MOBILE CONTROLS
===================================================== */

function holdButton(id,key){

    const b=document.getElementById(id);

    b.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    b.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

    b.addEventListener(
        "mousedown",
        ()=>{
            keys[key]=true;
        }
    );

    b.addEventListener(
        "mouseup",
        ()=>{
            keys[key]=false;
        }
    );
}

holdButton("left","arrowleft");
holdButton("right","arrowright");

document.getElementById("jump")
.addEventListener("touchstart",e=>{
    e.preventDefault();
    jump();
});

document.getElementById("jump")
.addEventListener("mousedown",jump);

/* =====================================================
   COLLISION
===================================================== */

function solidAt(px,py){

    const tx=Math.floor(px/TILE);
    const ty=Math.floor(py/TILE);

    if(
        tx<0||
        tx>=WORLD_W||
        ty<0||
        ty>=WORLD_H
    )return true;

    return blocks[
        world[ty][tx]
    ]?.solid===true;
}

function collides(x,y){

    const p=2;

    return(
        solidAt(x+p,y+p)||
        solidAt(x+player.w-p,y+p)||
        solidAt(x+p,y+player.h-p)||
        solidAt(
            x+player.w-p,
            y+player.h-p
        )
    );
}

/* =====================================================
   UPDATE
===================================================== */

function update(){

    let moving=false;

    if(
        keys["a"]||
        keys["arrowleft"]
    ){

        player.vx=-player.speed;
        player.direction=-1;
        moving=true;
    }

    else if(
        keys["d"]||
        keys["arrowright"]
    ){

        player.vx=player.speed;
        player.direction=1;
        moving=true;
    }

    else{
        player.vx*=.75;
    }

    if(moving){
        player.anim+=.22;
    }

    player.vy+=.45;

    if(player.vy>12)
        player.vy=12;

    let nx=player.x+player.vx;

    if(!collides(nx,player.y)){
        player.x=nx;
    }else{
        player.vx=0;
    }

    let ny=player.y+player.vy;

    if(!collides(player.x,ny)){

        player.y=ny;
        player.grounded=false;

    }else{

        if(player.vy>0)
            player.grounded=true;

        player.vy=0;
    }

    /* kamera */

    const targetX=
        player.x-
        canvas.width/2+
        player.w/2;

    const targetY=
        player.y-
        canvas.height/2+
        player.h/2;

    camera.x+=(targetX-camera.x)*.1;
    camera.y+=(targetY-camera.y)*.1;

    camera.x=Math.max(
        0,
        Math.min(
            camera.x,
            WORLD_W*TILE-canvas.width
        )
    );

    camera.y=Math.max(
        0,
        Math.min(
            camera.y,
            WORLD_H*TILE-canvas.height
        )
    );

    /* spadanie */

    if(player.y>WORLD_H*TILE){

        player.x=10*TILE;
        player.y=20*TILE;
        damage(20);
    }
}

/* =====================================================
   DRAW WORLD
===================================================== */

let time=0;

function drawWorld(){

    time+=.001;

    let night=
        (Math.sin(time)-.15)*.5;

    let skyR=80;
    let skyG=190;
    let skyB=250;

    ctx.fillStyle=
        `rgb(${skyR},${skyG},${skyB})`;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );

    const sx=
        Math.floor(camera.x/TILE)-1;

    const ex=
        Math.ceil(
            (camera.x+canvas.width)/TILE
        )+1;

    const sy=
        Math.floor(camera.y/TILE)-1;

    const ey=
        Math.ceil(
            (camera.y+canvas.height)/TILE
        )+1;

    for(let y=sy;y<ey;y++){

        if(y<0||y>=WORLD_H)continue;

        for(let x=sx;x<ex;x++){

            if(x<0||x>=WORLD_W)continue;

            drawBlock(
                world[y][x],
                x,
                y
            );
        }
    }

    /* słońce */

    ctx.fillStyle="#ffe477";

    ctx.beginPath();

    ctx.arc(
        canvas.width*.82,
        80,
        32,
        0,
        Math.PI*2
    );

    ctx.fill();
}

function drawBlock(type,x,y){

    if(type==="air")return;

    const px=x*TILE-camera.x;
    const py=y*TILE-camera.y;

    if(
        px<-TILE||
        py<-TILE||
        px>canvas.width||
        py>canvas.height
    )return;

    if(type==="water"){

        ctx.fillStyle="#319fd5";

        ctx.fillRect(
            px,py,
            TILE,TILE
        );

        ctx.fillStyle="#73d5fa";

        ctx.fillRect(
            px,
            py+5+
            Math.sin(
                Date.now()*.004+x
            )*2,
            TILE,
            3
        );

        return;
    }

    if(type==="torch"){

        ctx.fillStyle="#70401d";

        ctx.fillRect(
            px+14,
            py+8,
            4,
            24
        );

        ctx.fillStyle="#ff8c00";

        ctx.fillRect(
            px+10,
            py+3,
            12,
            12
        );

        ctx.fillStyle="#fff27a";

        ctx.fillRect(
            px+13,
            py+5,
            6,
            8
        );

        return;
    }

    ctx.fillStyle=blocks[type].color;

    ctx.fillRect(
        px,py,
        TILE,TILE
    );

    /* grass */

    if(type==="grass"){

        ctx.fillStyle="#75d63c";

        ctx.fillRect(
            px,py,
            TILE,6
        );
    }

    /* dirt */

    if(type==="dirt"){

        ctx.fillStyle="#70411f";

        for(let i=0;i<3;i++){

            ctx.fillRect(
                px+
                ((x*13+i*7)%25),
                py+
                ((y*9+i*11)%25),
                4,4
            );
        }
    }

    /* stone */

    if(type==="stone"){

        ctx.fillStyle="#606060";

        ctx.fillRect(
            px+5,py+7,6,5
        );

        ctx.fillRect(
            px+21,py+20,5,5
        );
    }

    /* wood */

    if(type==="wood"){

        ctx.fillStyle="#633715";

        ctx.fillRect(
            px+13,py,
            5,TILE
        );
    }

    /* leaves */

    if(type==="leaves"){

        ctx.fillStyle="#1d7529";

        ctx.fillRect(
            px+5,py+7,
            8,7
        );

        ctx.fillRect(
            px+19,py+17,
            7,6
        );
    }

    /* sand */

    if(type==="sand"){

        ctx.fillStyle="#bca763";

        ctx.fillRect(
            px+6,py+10,3,3
        );

        ctx.fillRect(
            px+22,py+21,3,3
        );
    }
}

/* =====================================================
   PLAYER DRAW
===================================================== */

function drawPlayer(){

    const x=
        player.x-camera.x;

    const y=
        player.y-camera.y;

    let leg=0;

    if(player.grounded){
        leg=
            Math.sin(player.anim)*4;
    }

    ctx.save();

    if(player.direction<0){

        ctx.translate(
            x+player.w,
            0
        );

        ctx.scale(-1,1);

        drawCharacter(
            0,y,leg
        );

    }else{

        drawCharacter(
            x,y,leg
        );
    }

    ctx.restore();
}

function drawCharacter(x,y,leg){

    /* nogi */

    ctx.fillStyle="#303030";

    ctx.fillRect(
        x+4,
        y+29+leg,
        6,
        14
    );

    ctx.fillRect(
        x+13,
        y+29-leg,
        6,
        14
    );

    /* ciało */

    ctx.fillStyle="#2775d8";

    ctx.fillRect(
        x+3,
        y+14,
        17,
        18
    );

    /* ręce */

    ctx.fillStyle="#f0b982";

    ctx.fillRect(
        x-2,
        y+16-leg,
        5,
        15
    );

    ctx.fillRect(
        x+20,
        y+16+leg,
        5,
        15
    );

    /* głowa */

    ctx.fillStyle="#f0b982";

    ctx.fillRect(
        x+2,
        y,
        20,
        17
    );

    /* włosy */

    ctx.fillStyle="#4b2b19";

    ctx.fillRect(
        x+2,y,
        20,5
    );

    ctx.fillRect(
        x+2,y+4,
        4,6
    );

    /* oczy */

    ctx.fillStyle="#111";

    ctx.fillRect(
        x+7,y+8,
        3,3
    );

    ctx.fillRect(
        x+15,y+8,
        3,3
    );
}

/* =====================================================
   BLOCK INTERACTION
===================================================== */

canvas.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);

canvas.addEventListener(
    "mousedown",
    e=>{

        const rect=
            canvas.getBoundingClientRect();

        const tx=Math.floor(
            (e.clientX+camera.x)/TILE
        );

        const ty=Math.floor(
            (e.clientY+camera.y)/TILE
        );

        if(
            tx<0||
            tx>=WORLD_W||
            ty<0||
            ty>=WORLD_H
        )return;

        const current=
            world[ty][tx];

        /* kopanie */

        if(e.button===0){

            if(
                current!=="air"&&
                current!=="water"&&
                current!=="leaves"
            ){

                world[ty][tx]="air";

                if(current==="grass"||
                   current==="dirt")
                    inventory.dirt++;

                if(current==="stone")
                    inventory.stone++;

                if(current==="wood")
                    inventory.wood++;

                if(current==="sand")
                    inventory.sand++;

                updateHotbar();
            }
        }

        /* stawianie */

        if(e.button===2){

            if(
                current==="air"||
                current==="water"||
                current==="leaves"
            ){

                if(
                    inventory[selected]>0
                ){

                    /* nie stawiaj na graczu */

                    const bx=tx*TILE;
                    const by=ty*TILE;

                    const overlap=
                        bx<player.x+player.w&&
                        bx+TILE>player.x&&
                        by<player.y+player.h&&
                        by+TILE>player.y;

                    if(!overlap){

                        world[ty][tx]=selected;

                        inventory[selected]--;

                        updateHotbar();
                    }
                }
            }
        }
    }
);

/* =====================================================
   HEALTH
===================================================== */

function damage(amount){

    player.health=
        Math.max(
            0,
            player.health-amount
        );

    updateHealth();

    if(player.health<=0){

        player.health=100;

        player.x=10*TILE;
        player.y=20*TILE;

        showMessage(
            "💀 Odrodziłeś się!"
        );
    }
}

function updateHealth(){

    const percent=
        player.health/player.maxHealth*100;

    document.getElementById(
        "healthBar"
    ).style.width=
        percent+"%";

    document.getElementById(
        "healthText"
    ).textContent=
        player.health+
        " / "+
        player.maxHealth;
}

/* =====================================================
   CRAFTING
===================================================== */

const crafting=
    document.getElementById("crafting");

document.getElementById("craft")
.addEventListener("click",()=>{

    crafting.style.display=
        crafting.style.display==="block"
        ?"none"
        :"block";
});

document.querySelectorAll(".recipe")
.forEach(recipe=>{

    recipe.addEventListener(
        "click",
        ()=>{

            const type=
                recipe.dataset.recipe;

            if(type==="wood"){

                if(inventory.wood>=4){

                    inventory.wood-=4;
                    inventory.dirt+=8;

                    showMessage(
                        "Zrobiono 8 desek!"
                    );
                }
                else{
                    showMessage(
                        "Brakuje drewna!"
                    );
                }
            }

            if(type==="torch"){

                if(
                    inventory.wood>=1&&
                    inventory.stone>=1
                ){

                    inventory.wood--;
                    inventory.stone--;
                    inventory.torch+=4;

                    showMessage(
                        "Zrobiono 4 pochodnie!"
                    );
                }
                else{
                    showMessage(
                        "Brakuje surowców!"
                    );
                }
            }

            if(type==="pickaxe"){

                if(
                    inventory.wood>=5&&
                    inventory.stone>=3
                ){

                    inventory.wood-=5;
                    inventory.stone-=3;

                    showMessage(
                        "⛏️ Stworzono kilof!"
                    );
                }
                else{
                    showMessage(
                        "Brakuje surowców!"
                    );
                }
            }

            updateHotbar();
        }
    );
});

/* =====================================================
   SAVE / LOAD
===================================================== */

document.getElementById("save")
.addEventListener("click",()=>{

    localStorage.setItem(
        "pixelWorldSave",
        JSON.stringify({
            world,
            player:{
                x:player.x,
                y:player.y
            },
            inventory
        })
    );

    showMessage(
        "💾 Świat zapisany!"
    );
});

function loadGame(){

    try{

        const save=
            JSON.parse(
                localStorage.getItem(
                    "pixelWorldSave"
                )
            );

        if(!save)return;

        if(save.world)
            world=save.world;

        if(save.player){

            player.x=
                save.player.x;

            player.y=
                save.player.y;
        }

        if(save.inventory)
            inventory=save.inventory;

        updateHotbar();

        showMessage(
            "📂 Wczytano świat!"
        );

    }catch(e){
        console.log(e);
    }
}

loadGame();

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function showMessage(text){

    const m=
        document.getElementById(
            "message"
        );

    m.textContent=text;
    m.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer=
        setTimeout(()=>{
            m.style.opacity=0;
        },1800);
}

/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    update();

    drawWorld();

    drawPlayer();

    requestAnimationFrame(loop);
}

updateHotbar();
updateHealth();

loop();

</script>
