<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PIXEL WORLD — TWO MODES</title>
  <style>
    :root {
      --bg: #070b10;
      --bg2: #0d1720;
      --panel: #101b25;
      --panel2: #182633;
      --line: #456477;
      --accent: #58d9ff;
      --accent2: #087fae;
      --danger: #742a32;
      --text: #fff;
      --muted: #9ce8ff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text); font-family: monospace;
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    }
    body { image-rendering: pixelated; }
    button, input, select { font: inherit; }
    button {
      cursor: pointer; color: var(--text); background: var(--panel2);
      border: 2px solid var(--line); padding: 10px 14px; font-weight: 900;
      transition: transform .08s ease, background .15s ease;
    }
    button:hover { background: #244052; }
    button:active { transform: translateY(2px); }
    .hidden { display: none !important; }

    #game {
      position: fixed; inset: 0; width: 100%; height: 100%;
      background: #111; display: block; image-rendering: pixelated;
    }

    #menu {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(#071421, #0d1720);
      overflow: auto;
    }
    .menu {
      width: min(520px, 94vw); padding: 26px; text-align: center;
    }
    .logo {
      font-size: clamp(32px, 7vw, 62px); font-weight: 900; letter-spacing: 4px;
      text-shadow: 4px 4px #000, 0 0 14px #00d9ff;
    }
    .sub {
      color: var(--muted); margin: 7px 0 18px; font-weight: 900;
    }
    .menuBtns { display: grid; gap: 10px; }
    .play { background: var(--accent2); border-color: var(--accent); }

    .panel {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center; padding: 15px;
      background: rgba(0,0,0,.76);
    }
    .box {
      width: min(700px, 96vw); max-height: 90vh; overflow: auto;
      background: var(--panel); border: 3px solid var(--line); padding: 20px;
      box-shadow: 8px 8px #000;
    }
    .box h2 { margin: 0 0 14px; color: #62dcff; }
    .close { float: right; background: var(--danger); padding: 6px 10px; }
    .row {
      display: flex; align-items: center; gap: 8px; margin: 10px 0;
    }
    .row > *:last-child { margin-left: auto; }
    input, select {
      background: #0b1219; color: var(--text); border: 2px solid var(--line);
      padding: 9px; min-width: 0;
    }

    #gameUI {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
    }
    .top {
      position: absolute; left: 10px; right: 10px; top: 10px;
      display: flex; align-items: center; gap: 8px; text-shadow: 2px 2px #000;
    }
    .hp {
      width: 145px; height: 18px; background: #222; border: 2px solid #000;
      position: relative;
    }
    .hp i {
      display: block; width: 100%; height: 100%; background: #36cf59;
    }
    .hp span {
      position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 14px;
    }
    .topRight {
      margin-left: auto; display: flex; gap: 5px; pointer-events: auto;
    }
    .small { padding: 6px 9px; }
    #help {
      position: absolute; left: 10px; bottom: 75px; font-size: 11px; text-shadow: 2px 2px #000;
    }
    #netStatus {
      position: absolute; top: 40px; left: 10px; font-size: 11px; color: #8fe7ff;
      text-shadow: 2px 2px #000;
    }
    #hotbar {
      position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
      display: flex; gap: 4px; padding: 4px; background: rgba(5,9,13,.86);
      border: 2px solid var(--line); pointer-events: auto;
    }
    .slot {
      width: 48px; height: 48px; background: #18232c; border: 2px solid #5d7180;
      position: relative; display: grid; place-items: center;
    }
    .slot.sel {
      border-color: var(--text); box-shadow: 0 0 0 2px #00d9ff;
    }
    .icon {
      width: 25px; height: 25px; border: 2px solid #111;
      image-rendering: pixelated;
    }
    .count {
      position: absolute; right: 2px; bottom: 0; font-size: 12px; text-shadow: 2px 2px #000;
    }

    #chatBox {
      position: fixed; left: 10px; bottom: 78px; width: min(360px, 88vw); z-index: 70;
      pointer-events: auto; font-family: monospace;
    }
    #chatMessages {
      height: 145px; overflow-y: auto; background: rgba(5,10,15,.82);
      border: 2px solid #456477; padding: 7px; display: flex; flex-direction: column; gap: 4px;
    }
    .chatLine { font-size: 12px; word-break: break-word; text-shadow: 1px 1px #000; }
    .chatName { color: #6fe8ff; font-weight: 900; }
    .chatInputRow { display: flex; gap: 5px; margin-top: 5px; }
    .chatInputRow input { flex: 1; min-width: 0; }

    #pause {
      position: fixed; inset: 0; z-index: 25; display: none; place-items: center;
      background: rgba(0,0,0,.52);
    }
    .pauseBox {
      background: #101b25; border: 3px solid var(--line); padding: 24px; text-align: center;
    }

    @media (max-width:700px) {
      #help { display: none; }
      .slot { width: 43px; height: 43px; }
      .icon { width: 22px; height: 22px; }
      #chatBox { bottom: 125px; width: calc(100vw - 20px); }
      #chatMessages { height: 110px; }
      .chatLine { font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu">
    <div class="menu">
      <div class="logo">PIXEL WORLD</div>
      <div class="sub">DWA TRYBY • STABILNY + PEŁNY</div>
      <div class="menuBtns">
        <button id="playStable" class="play">▶ STABILNA GRA</button>
        <button id="playFull">🚀 PEŁNA WERSJA</button>
        <button id="settings">⚙ USTAWIENIA</button>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="panel hidden">
    <div class="box">
      <button class="close" data-close="settingsPanel">X</button>
      <h2>⚙ USTAWIENIA</h2>
      <div class="row"><span>Pixel Perfect</span><input id="pixel" type="checkbox" checked></div>
      <div class="row"><span>Autozapis</span><input id="autoSave" type="checkbox" checked></div>
      <div class="row"><span>Głośność</span><input id="vol" type="range" min="0" max="1" step=".05" value=".5"></div>
    </div>
  </div>

  <div id="craft" class="panel hidden">
    <div class="box">
      <button class="close" data-close="craft">X</button>
      <h2>🔨 CRAFTING</h2>
      <div class="row"><span>2 × piasek → 1 × szkło</span><button id="glassCraft">STWÓRZ</button></div>
      <div class="row"><span>2 × kamień → 1 × cegła</span><button id="brickCraft">STWÓRZ</button></div>
      <div class="row"><span>4 × drewno → blok drewna</span><button id="woodCraft">STWÓRZ</button></div>
    </div>
  </div>

  <div id="gameUI">
    <div class="top">
      <b>PIXEL WORLD</b>
      <div class="hp"><i id="hpFill"></i><span id="hpText">100 / 100</span></div>
      <div class="topRight">
        <button class="small" id="saveBtn">💾</button>
        <button class="small" id="craftBtn">🔨</button>
        <button class="small" id="chatBtn">💬</button>
        <button class="small" id="pauseBtn">Ⅱ</button>
      </div>
    </div>

    <div id="netStatus">Offline</div>
    <div id="help">A/D lub ←/→ • W/↑/SPACJA • LPM kop • PPM buduj • E crafting • ESC pauza</div>
    <div id="hotbar"></div>
  </div>

  <div id="chatBox" class="hidden">
    <div id="chatMessages"></div>
    <div class="chatInputRow">
      <input id="chatInput" maxlength="120" placeholder="Napisz wiadomość..." autocomplete="off">
      <button id="chatSend">WYŚLIJ</button>
    </div>
  </div>

  <div id="pause">
    <div class="pauseBox">
      <h2>Ⅱ PAUZA</h2>
      <button id="resume">▶ WRÓĆ</button>
      <button id="menuBack">🏠 MENU</button>
    </div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const chatBox = document.getElementById("chatBox");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const hotbarEl = document.getElementById("hotbar");
    const hpFill = document.getElementById("hpFill");
    const hpText = document.getElementById("hpText");

    const TILE = {
      air: 0,
      dirt: 1,
      grass: 2,
      stone: 3,
      wood: 4,
      sand: 5,
      glass: 6,
      brick: 7,
      water: 8
    };

    const ITEM_TO_TILE = {
      dirt: TILE.dirt,
      grass: TILE.grass,
      stone: TILE.stone,
      wood: TILE.wood,
      sand: TILE.sand,
      glass: TILE.glass,
      brick: TILE.brick,
      water: TILE.water
    };

    const HOTBAR_ITEMS = ["dirt", "stone", "wood", "sand", "glass", "brick"];

    const state = {
      mode: "stable",
      started: false,
      paused: false,
      selectedSlot: 0,
      width: 170,
      height: 48,
      tileSize: 22,
      world: [],
      cameraX: 0,
      cameraY: 0,
      keys: {},
      lastTime: 0,
      inventory: { dirt: 40, stone: 15, wood: 12, sand: 18, glass: 0, brick: 0 },
      player: {
        x: 12,
        y: 12,
        w: 0.9,
        h: 1.8,
        vx: 0,
        vy: 0,
        speed: 4.6,
        jump: 7.8,
        onGround: false,
        hp: 100,
        maxHp: 100,
        dir: 1
      }
    };

    function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

    function createWorld() {
      const world = [];
      for (let y = 0; y < state.height; y++) {
        const row = [];
        for (let x = 0; x < state.width; x++) {
          let tile = TILE.air;
          if (y > state.height - 8) tile = TILE.dirt;
          if (y > state.height - 6 && Math.random() < 0.22) tile = TILE.stone;
          if (y > state.height - 4 && Math.random() < 0.08) tile = TILE.sand;
          if (y > state.height - 4 && x % 17 === 0) tile = TILE.grass;
          if (y > state.height - 2) tile = TILE.dirt;
          row.push(tile);
        }
        world.push(row);
      }
      state.world = world;
    }

    function createWorldFull() {
      const world = [];
      for (let y = 0; y < state.height; y++) {
        const row = [];
        for (let x = 0; x < state.width; x++) {
          let tile = TILE.air;
          const terrain = Math.sin(x * 0.4) * 3 + Math.sin((x + y) * 0.25) * 2;
          if (y >= state.height - 5 + Math.floor(terrain)) tile = TILE.dirt;
          if (y >= state.height - 3 && Math.random() < 0.25) tile = TILE.sand;
          if (y >= state.height - 2 && Math.random() < 0.1) tile = TILE.stone;
          row.push(tile);
        }
        world.push(row);
      }
      state.world = world;
    }

    function getTile(x, y) {
      if (x < 0 || y < 0 || x >= state.width || y >= state.height) return TILE.air;
      return state.world[y][x];
    }

    function setTile(x, y, tile) {
      if (x < 0 || y < 0 || x >= state.width || y >= state.height) return;
      state.world[y][x] = tile;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function updateHotbar() {
      hotbarEl.innerHTML = "";
      HOTBAR_ITEMS.forEach((name, index) => {
        const slot = document.createElement("div");
        slot.className = "slot" + (state.selectedSlot === index ? " sel" : "");

        const colorMap = {
          dirt: "#8a5f3a", stone: "#7a7f8e", wood: "#a57a43",
          sand: "#d9c77d", glass: "#7ce2ff", brick: "#c56952"
        };

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.style.background = colorMap[name] || "#5eb7ff";

        const count = document.createElement("div");
        count.className = "count";
        count.textContent = index + 1;

        slot.appendChild(icon);
        slot.appendChild(count);
        hotbarEl.appendChild(slot);
      });
    }

    function getCurrentTileName() {
      return HOTBAR_ITEMS[state.selectedSlot] || "dirt";
    }

    function addChatMessage(name, text) {
      const line = document.createElement("div");
      line.className = "chatLine";
      line.innerHTML = '<span class="chatName">' + name + ':</span> ' + text;
      chatMessages.appendChild(line);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showPanel(id) {
      document.querySelectorAll(".panel").forEach(el => {
        if (el.id === id) el.classList.remove("hidden");
        else el.classList.add("hidden");
      });
    }

    function hidePanels() {
      document.querySelectorAll(".panel").forEach(el => el.classList.add("hidden"));
    }

    function playerCollidesAt(x, y) {
      const left = Math.floor(x);
      const right = Math.floor(x + state.player.w);
      const top = Math.floor(y);
      const bottom = Math.floor(y + state.player.h);
      for (let yy = top; yy <= bottom; yy++) {
        for (let xx = left; xx <= right; xx++) {
          if (getTile(xx, yy) !== TILE.air && getTile(xx, yy) !== TILE.water) return true;
        }
      }
      return false;
    }

    function updatePlayer(dt) {
      const player = state.player;
      const move = (state.keys.ArrowRight || state.keys.KeyD ? 1 : 0) - (state.keys.ArrowLeft || state.keys.KeyA ? 1 : 0);
      const jump = state.keys.ArrowUp || state.keys.KeyW || state.keys.Space;

      if (move !== 0) {
        player.vx = move * player.speed;
        player.dir = move > 0 ? 1 : -1;
      } else {
        player.vx *= 0.8;
        if (Math.abs(player.vx) < 0.05) player.vx = 0;
      }

      if (jump && player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
      }

      const nextX = player.x + player.vx * dt;
      if (!playerCollidesAt(nextX, player.y)) player.x = nextX;

      player.vy += 18 * dt;
      const nextY = player.y + player.vy * dt;
      if (!playerCollidesAt(player.x, nextY)) {
        player.y = nextY;
      } else {
        if (player.vy > 0) player.onGround = true;
        player.vy = 0;
      }

      if (player.y > state.height + 10) {
        player.y = 10; player.hp = Math.max(0, player.hp - 10);
      }

      state.cameraX = clamp(player.x * state.tileSize - window.innerWidth * 0.5, 0, state.width * state.tileSize - window.innerWidth);
      state.cameraY = clamp(player.y * state.tileSize - window.innerHeight * 0.5, 0, state.height * state.tileSize - window.innerHeight + 80);

      hpFill.style.width = (player.hp / player.maxHp) * 100 + "%";
      hpText.textContent = Math.round(player.hp) + " / " + player.maxHp;
    }

    function tileColor(tile) {
      const map = {
        [TILE.air]: "#000000",
        [TILE.dirt]: "#7c5a3d",
        [TILE.grass]: "#3e9a4b",
        [TILE.stone]: "#7c808b",
        [TILE.wood]: "#9a7140",
        [TILE.sand]: "#d9c77d",
        [TILE.glass]: "#7ce2ff",
        [TILE.brick]: "#c56952",
        [TILE.water]: "#3a88dc"
      };
      return map[tile] || "#ffffff";
    }

    function drawTile(x, y, tile) {
      const px = x * state.tileSize - state.cameraX;
      const py = y * state.tileSize - state.cameraY;
      ctx.fillStyle = tileColor(tile);
      ctx.fillRect(px, py, state.tileSize, state.tileSize);
      if (tile === TILE.grass) {
        ctx.fillStyle = "#2e7c31"; ctx.fillRect(px, py, state.tileSize, 4);
      }
      if (tile === TILE.water) {
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(px + 2, py + 2, state.tileSize - 4, state.tileSize - 4);
      }
    }

    function drawPlayer() {
      const p = state.player;
      const px = p.x * state.tileSize - state.cameraX;
      const py = p.y * state.tileSize - state.cameraY;
      ctx.fillStyle = "#d99b70";
      ctx.fillRect(px, py, p.w * state.tileSize, p.h * state.tileSize);
      ctx.fillStyle = "#2a2a2a";
      ctx.fillRect(px - 2, py - 8, (p.w + 0.18) * state.tileSize, 6);
      ctx.fillStyle = "#4dd0ff";
      ctx.fillRect(px - 2, py - 8, ((p.hp / p.maxHp) * (p.w + 0.18) * state.tileSize), 6);
    }

    function render() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      const startX = Math.floor(state.cameraX / state.tileSize);
      const endX = Math.ceil((state.cameraX + w) / state.tileSize) + 1;
      const startY = Math.floor(state.cameraY / state.tileSize);
      const endY = Math.ceil((state.cameraY + h) / state.tileSize) + 2;

      for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
          if (x >= 0 && y >= 0 && x < state.width && y < state.height) {
            const tile = getTile(x, y);
            if (tile !== TILE.air) drawTile(x, y, tile);
          }
        }
      }
      drawPlayer();
    }

    function getWorldMousePos(event) {
      const rect = canvas.getBoundingClientRect();
      const sx = event.clientX - rect.left;
      const sy = event.clientY - rect.top;
      const wx = (sx + state.cameraX) / state.tileSize;
      const wy = (sy + state.cameraY) / state.tileSize;
      return { x: Math.floor(wx), y: Math.floor(wy) };
    }

    function tileToItem(tile) {
      const map = {
        [TILE.dirt]: "dirt",
        [TILE.stone]: "stone",
        [TILE.wood]: "wood",
        [TILE.sand]: "sand",
        [TILE.glass]: "glass",
        [TILE.brick]: "brick",
        [TILE.grass]: "dirt"
      };
      return map[tile] || null;
    }

    function mineBlock(x, y) {
      const playerTileX = Math.floor(state.player.x + state.player.w / 2);
      const playerTileY = Math.floor(state.player.y + state.player.h / 2);
      const dist = Math.hypot(x - playerTileX, y - playerTileY);
      if (dist > 6) return;
      const current = getTile(x, y);
      if (current === TILE.air) return;
      setTile(x, y, TILE.air);
      const item = tileToItem(current);
      if (item) state.inventory[item] = (state.inventory[item] || 0) + 1;
    }

    function placeBlock(x, y) {
      const playerTileX = Math.floor(state.player.x + state.player.w / 2);
      const playerTileY = Math.floor(state.player.y + state.player.h / 2);
      const dist = Math.hypot(x - playerTileX, y - playerTileY);
      if (dist > 4) return;
      const tileName = getCurrentTileName();
      const tile = ITEM_TO_TILE[tileName];
      if (!tile) return;
      if ((state.inventory[tileName] || 0) <= 0) return;
      if (getTile(x, y) !== TILE.air) return;
      setTile(x, y, tile);
      state.inventory[tileName] -= 1;
    }

    function saveGame() {
      const save = {
        mode: state.mode,
        player: state.player,
        inventory: state.inventory,
        world: state.world,
        selectedSlot: state.selectedSlot
      };
      localStorage.setItem("pixel-world-save", JSON.stringify(save));
      addChatMessage("System", "Zapisano postęp.");
    }

    function loadGame() {
      const raw = localStorage.getItem("pixel-world-save");
      if (!raw) return false;
      try {
        const save = JSON.parse(raw);
        state.mode = save.mode || state.mode;
        Object.assign(state.player, save.player || {});
        Object.assign(state.inventory, save.inventory || {});
        state.world = save.world || state.world;
        state.selectedSlot = save.selectedSlot || 0;
        return true;
      } catch {
        return false;
      }
    }

    function startGame(mode) {
      state.mode = mode;
      if (mode === "stable") createWorld();
      else createWorldFull();
      if (!loadGame()) {
        state.player.x = 12; state.player.y = 12;
      }
      state.started = true; state.paused = false;
      menu.classList.add("hidden"); chatBox.classList.remove("hidden");
      document.getElementById("pause").style.display = "none";
      updateHotbar();
      addChatMessage("System", "Uruchomiono tryb: " + (mode === "stable" ? "STABILNY" : "PEŁNY"));
    }

    function togglePause() {
      if (!state.started) return;
      state.paused = !state.paused;
      document.getElementById("pause").style.display = state.paused ? "grid" : "none";
    }

    function handleCraft(item) {
      const recipes = {
        glass: { sand: 2 },
        brick: { stone: 2 },
        wood: { wood: 4 }
      };
      const recipe = recipes[item];
      if (!recipe) return;
      let ok = true;
      Object.entries(recipe).forEach(([name, count]) => {
        if ((state.inventory[name] || 0) < count) ok = false;
      });
      if (!ok) {
        addChatMessage("Crafting", "Brakuje surowców.");
        return;
      }
      Object.entries(recipe).forEach(([name, count]) => {
        state.inventory[name] -= count;
      });
      state.inventory[item] = (state.inventory[item] || 0) + 1;
      addChatMessage("Crafting", "Wytworzono: " + item + ".");
    }

    function loop(ts) {
      const dt = Math.min((ts - state.lastTime) / 1000 || 0.016, 0.033);
      state.lastTime = ts;
      if (!state.paused && state.started) updatePlayer(dt);
      render();
      requestAnimationFrame(loop);
    }

    document.getElementById("playStable").addEventListener("click", () => startGame("stable"));
    document.getElementById("playFull").addEventListener("click", () => startGame("full"));
    document.getElementById("settings").addEventListener("click", () => showPanel("settingsPanel"));
    document.getElementById("craftBtn").addEventListener("click", () => showPanel("craft"));
    document.getElementById("pauseBtn").addEventListener("click", togglePause);
    document.getElementById("resume").addEventListener("click", togglePause);
    document.getElementById("menuBack").addEventListener("click", () => {
      state.started = false; state.paused = false;
      document.getElementById("pause").style.display = "none";
      menu.classList.remove("hidden"); chatBox.classList.add("hidden"); hidePanels();
    });
    document.getElementById("saveBtn").addEventListener("click", saveGame);
    document.getElementById("chatBtn").addEventListener("click", () => chatBox.classList.toggle("hidden"));
    document.getElementById("chatSend").addEventListener("click", () => {
      const value = chatInput.value.trim(); if (!value) return;
      addChatMessage("Ty", value); chatInput.value = "";
    });
    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") document.getElementById("chatSend").click();
    });
    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => {
        const panel = btn.closest(".panel"); if (panel) panel.classList.add("hidden");
      });
    });
    document.getElementById("glassCraft").addEventListener("click", () => handleCraft("glass"));
    document.getElementById("brickCraft").addEventListener("click", () => handleCraft("brick"));
    document.getElementById("woodCraft").addEventListener("click", () => handleCraft("wood"));

    window.addEventListener("keydown", (event) => {
      state.keys[event.code] = true;
      if (event.code === "Escape") togglePause();
      if (event.code === "Digit1") state.selectedSlot = 0;
      if (event.code === "Digit2") state.selectedSlot = 1;
      if (event.code === "Digit3") state.selectedSlot = 2;
      if (event.code === "Digit4") state.selectedSlot = 3;
      if (event.code === "Digit5") state.selectedSlot = 4;
      if (event.code === "Digit6") state.selectedSlot = 5;
      if (event.code === "KeyE") showPanel("craft");
      if (event.code === "KeyF") saveGame();
    });
    window.addEventListener("keyup", (event) => { state.keys[event.code] = false; });
    window.addEventListener("resize", resizeCanvas);

    canvas.addEventListener("mousedown", (event) => {
      if (!state.started) return;
      const pos = getWorldMousePos(event);
      if (event.button === 0) mineBlock(pos.x, pos.y);
      if (event.button === 2) placeBlock(pos.x, pos.y);
    });
    canvas.addEventListener("contextmenu", event => event.preventDefault());

    function init() {
      resizeCanvas(); createWorld(); updateHotbar();
      addChatMessage("System", "Witaj w Pixel World. Wybierz tryb gry.");
      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
