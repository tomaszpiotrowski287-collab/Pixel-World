<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PIXEL WORLD — SINGLEPLAYER</title>
  <style>
    :root {
      --bg-1: #071421;
      --bg-2: #0d1720;
      --panel: #101b25;
      --panel-2: #182633;
      --panel-border: #456477;
      --accent: #55dfff;
      --accent-2: #087fae;
      --danger: #742a32;
      --text: #ffffff;
      --muted: #9ce8ff;
      --shadow: rgba(0,0,0,.7);
      --tile: #2d3d47;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b10;
      color: var(--text);
      font-family: monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      image-rendering: pixelated;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      color: var(--text);
      background: var(--panel-2);
      border: 2px solid var(--panel-border);
      padding: 10px 14px;
      font-weight: 900;
      transition: transform .08s ease, background .15s ease, filter .15s ease;
    }

    button:hover { background: #244052; }
    button:active { transform: translateY(2px); }
    .hidden { display: none !important; }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #111;
      image-rendering: pixelated;
      display: block;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(var(--bg-1), var(--bg-2));
      overflow: auto;
    }

    .menu {
      width: min(460px, 94vw);
      padding: 26px;
      text-align: center;
    }

    .logo {
      font-size: clamp(34px, 8vw, 66px);
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 4px 4px #000, 0 0 14px #00d9ff;
    }

    .sub {
      color: var(--muted);
      margin: 7px 0 22px;
      font-weight: 900;
    }

    .menuArt {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      background: #122330;
      border: 4px solid #35576a;
      position: relative;
    }

    .menuArt::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 18px;
      width: 40px;
      height: 38px;
      background: #f2b77d;
      box-shadow: 0 38px 0 #2688d8;
    }

    .menuArt::after {
      content: "";
      position: absolute;
      left: 28px;
      top: 18px;
      width: 40px;
      height: 9px;
      background: #321c10;
    }

    .menuBtns {
      display: grid;
      gap: 9px;
    }

    .play {
      background: var(--accent-2);
      border-color: var(--accent);
    }

    .panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0,0,0,.76);
    }

    .box {
      width: min(650px, 95vw);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 3px solid var(--panel-border);
      padding: 20px;
      box-shadow: 8px 8px #000;
    }

    .box h2 {
      margin: 0 0 14px;
      color: #62dcff;
    }

    .close {
      float: right;
      background: var(--danger);
      padding: 6px 10px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 10px 0;
    }

    .row > *:last-child {
      margin-left: auto;
    }

    input, select {
      background: #0b1219;
      color: var(--text);
      border: 2px solid var(--panel-border);
      padding: 9px;
      min-width: 0;
    }

    #gameUI {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .top {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      text-shadow: 2px 2px #000;
    }

    .hp {
      width: 145px;
      height: 18px;
      background: #222;
      border: 2px solid #000;
      position: relative;
    }

    .hp i {
      display: block;
      width: 100%;
      height: 100%;
      background: #36cf59;
    }

    .hp span {
      position: absolute;
      inset: 0;
      text-align: center;
      font-size: 11px;
      line-height: 14px;
    }

    .topRight {
      margin-left: auto;
      display: flex;
      gap: 5px;
      pointer-events: auto;
    }

    .small {
      padding: 6px 9px;
    }

    #netStatus {
      position: absolute;
      top: 40px;
      left: 10px;
      font-size: 11px;
      color: #8fe7ff;
      text-shadow: 2px 2px #000;
    }

    #help {
      position: absolute;
      left: 10px;
      bottom: 75px;
      font-size: 11px;
      text-shadow: 2px 2px #000;
    }

    #hotbar {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(5,9,13,.86);
      border: 2px solid var(--panel-border);
      pointer-events: auto;
    }

    .slot {
      width: 48px;
      height: 48px;
      background: #18232c;
      border: 2px solid #5d7180;
      position: relative;
      display: grid;
      place-items: center;
    }

    .slot.sel {
      border-color: var(--text);
      box-shadow: 0 0 0 2px #00d9ff;
    }

    .icon {
      width: 25px;
      height: 25px;
      border: 2px solid #111;
      background: #5eb7ff;
    }

    .count {
      position: absolute;
      right: 2px;
      bottom: 0;
      font-size: 12px;
      text-shadow: 2px 2px #000;
    }

    .mobile {
      display: none;
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 70px;
      justify-content: space-between;
      pointer-events: none;
    }

    .mobileGroup {
      display: flex;
      gap: 8px;
    }

    .mob {
      width: 60px;
      height: 60px;
      background: rgba(15,28,38,.72);
      border: 2px solid #78909f;
      pointer-events: auto;
      touch-action: none;
      font-size: 22px;
    }

    #pause {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.52);
    }

    .pauseBox {
      background: #101b25;
      border: 3px solid var(--panel-border);
      padding: 24px;
      text-align: center;
    }

    #chatBox {
      position: fixed;
      left: 10px;
      bottom: 78px;
      width: min(360px, 88vw);
      z-index: 70;
      pointer-events: auto;
      font-family: monospace;
    }

    #chatMessages {
      height: 145px;
      overflow-y: auto;
      background: rgba(5,10,15,.82);
      border: 2px solid #456477;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chatLine {
      font-size: 12px;
      word-break: break-word;
      text-shadow: 1px 1px #000;
    }

    .chatName {
      font-weight: 900;
      color: #6fe8ff;
    }

    .chatInputRow {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .chatInputRow input {
      flex: 1;
      min-width: 0;
    }

    @media (max-width: 700px) {
      .mobile { display: flex; }
      #help { display: none; }
      .slot { width: 43px; height: 43px; }
      .icon { width: 22px; height: 22px; }
      #chatBox { bottom: 125px; width: calc(100vw - 20px); }
      #chatMessages { height: 110px; }
      .chatLine { font-size: 11px; }
    }

    @media (pointer: coarse) {
      button { min-height: 38px; }
      .small { min-height: 40px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu">
    <div class="menu">
      <div class="logo">PIXEL WORLD</div>
      <div class="sub">MINI PIXEL SANDBOX • SINGLEPLAYER</div>
      <div class="menuArt"></div>
      <div class="menuBtns">
        <button id="play" class="play">▶ GRAJ</button>
        <button id="menuHubBtn">🌎 PIXEL WORLD HUB</button>
        <button id="news">📰 NEWS</button>
        <button id="settings">⚙ USTAWIENIA</button>
      </div>
    </div>
  </div>

  <div id="info" class="panel hidden">
    <div class="box">
      <button class="close" data-close="info">X</button>
      <h2 id="infoTitle"></h2>
      <div id="infoText"></div>
    </div>
  </div>

  <div id="settingsPanel" class="panel hidden">
    <div class="box">
      <button class="close" data-close="settingsPanel">X</button>
      <h2>⚙ USTAWIENIA</h2>
      <div class="row"><span>Pixel Perfect</span><input id="pixel" type="checkbox" checked></div>
      <div class="row"><span>Dzień / noc</span><input id="dn" type="checkbox" checked></div>
      <div class="row"><span>Cząsteczki</span><input id="parts" type="checkbox" checked></div>
      <div class="row"><span>Dźwięki</span><input id="snd" type="checkbox" checked></div>
      <div class="row"><span>Głośność</span><input id="vol" type="range" min="0" max="1" step=".05" value=".5"></div>
      <div class="row"><span>Autozapis</span><input id="auto" type="checkbox" checked></div>
    </div>
  </div>

  <div id="craft" class="panel hidden">
    <div class="box">
      <button class="close" data-close="craft">X</button>
      <h2>🔨 CRAFTING</h2>
      <div class="row"><span>2 × piasek → 1 × szkło</span><button id="glassCraft">STWÓRZ</button></div>
      <div class="row"><span>2 × kamień → 1 × cegła</span><button id="brickCraft">STWÓRZ</button></div>
    </div>
  </div>

  <div id="gameUI">
    <div class="top">
      <b>PIXEL WORLD</b>
      <div class="hp">
        <i id="hpFill"></i>
        <span id="hpText">100 / 100</span>
      </div>
      <div class="topRight">
        <button class="small" id="save">💾</button>
        <button class="small" id="craftBtn">🔨</button>
        <button class="small" id="inventoryBtn" title="Ekwipunek">🎒</button>
        <button class="small" id="chatBtn" title="Czat">💬</button>
        <button class="small" id="gameSettingsBtn">⚙</button>
        <button class="small" id="pauseBtn">Ⅱ</button>
      </div>
    </div>

    <div id="netStatus">Offline</div>
    <div id="help">A/D lub ←/→ • W/↑/SPACJA • LPM kop • PPM buduj • E crafting • ESC pauza</div>
    <div id="hotbar"></div>

    <div class="mobile">
      <div class="mobileGroup">
        <button class="mob" id="left">◀</button>
        <button class="mob" id="right">▶</button>
      </div>
      <button class="mob" id="jump">▲</button>
    </div>
  </div>

  <div id="chatBox" class="hidden">
    <div id="chatMessages"></div>
    <div class="chatInputRow">
      <input id="chatInput" maxlength="120" placeholder="Napisz wiadomość..." autocomplete="off">
      <button id="chatSend">WYŚLIJ</button>
    </div>
  </div>

  <div id="pause">
    <div class="pauseBox">
      <h2>Ⅱ PAUZA</h2>
      <button id="resume">▶ WRÓĆ</button>
      <button id="menuBack">🏠 MENU</button>
    </div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const settingsPanel = document.getElementById("settingsPanel");
    const craftPanel = document.getElementById("craft");
    const chatBox = document.getElementById("chatBox");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const hotbar = document.getElementById("hotbar");
    const hpFill = document.getElementById("hpFill");
    const hpText = document.getElementById("hpText");

    const world = {
      w: 60,
      h: 20,
      tiles: []
    };

    const player = {
      x: 8,
      y: 8,
      w: 1,
      h: 1.8,
      vx: 0,
      vy: 0,
      onGround: false,
      maxHp: 100,
      hp: 100,
      speed: 5.5,
      jump: 10.5
    };

    const keys = {};
    let started = false;
    let paused = false;
    let lastTime = 0;
    let selectedSlot = 0;
    const hotbarItems = ["dirt", "stone", "wood", "sand"];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function initWorld() {
      world.tiles = [];
      for (let y = 0; y < world.h; y++) {
        const row = [];
        for (let x = 0; x < world.w; x++) {
          const isGround = y >= world.h - 4;
          let tile = 0;
          if (isGround) tile = 1;
          if (y === world.h - 4 && x % 9 === 0) tile = 2;
          row.push(tile);
        }
        world.tiles.push(row);
      }
    }

    function getTile(x, y) {
      if (x < 0 || y < 0 || x >= world.w || y >= world.h) return 0;
      return world.tiles[y][x];
    }

    function setTile(x, y, value) {
      if (x < 0 || y < 0 || x >= world.w || y >= world.h) return;
      world.tiles[y][x] = value;
    }

    function drawBlock(x, y, size, type) {
      const colors = {
        0: "#000000",
        1: "#78a742",
        2: "#b9824a",
        3: "#465a68"
      };
      ctx.fillStyle = colors[type] || "#9abf7d";
      ctx.fillRect(x * size, y * size, size, size);
    }

    function render() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const tileSize = 32;

      ctx.clearRect(0, 0, width, height);

      const offsetX = clamp(player.x * tileSize - width / 2, 0, Math.max(0, world.w * tileSize - width));

      for (let y = 0; y < world.h; y++) {
        for (let x = 0; x < world.w; x++) {
          const tile = getTile(x, y);
          if (tile === 0) continue;
          drawBlock(x - offsetX / tileSize, y, tileSize, tile);
        }
      }

      const px = width / 2 - player.w * tileSize / 2;
      const py = height - player.h * tileSize - 40;
      ctx.fillStyle = "#d99b70";
      ctx.fillRect(px, py, player.w * tileSize, player.h * tileSize);

      ctx.fillStyle = "#000";
      ctx.fillRect(px, py - 12, player.w * tileSize, 10);
      ctx.fillStyle = "#4dd0ff";
      ctx.fillRect(px, py - 12, (player.hp / player.maxHp) * player.w * tileSize, 10);
    }

    function updatePlayer(dt) {
      const move = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
      player.vx = move * player.speed;

      if ((keys.ArrowUp || keys.KeyW || keys.Space) && player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
      }

      player.vy += 22 * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      const tileSize = 32;
      const baseY = player.y;
      const newX = clamp(player.x, 0, world.w - player.w);
      player.x = newX;

      if (player.y > world.h - 2) {
        player.y = world.h - 2;
        player.vy = 0;
        player.onGround = true;
      }

      const leftTile = Math.floor(player.x);
      const rightTile = Math.floor(player.x + player.w);
      const bottomTile = Math.floor((player.y + player.h) + 0.2);
      const topTile = Math.floor(player.y);

      if (bottomTile >= world.h || getTile(rightTile, bottomTile) !== 0 || getTile(leftTile, bottomTile) !== 0) {
        player.y = Math.floor(player.y + player.h) - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (topTile >= 0 && getTile(leftTile, topTile) !== 0 && getTile(rightTile, topTile) !== 0) {
        player.y = Math.ceil(player.y + 0.1);
        player.vy = 0;
      }

      if (baseY !== player.y) {
        player.onGround = player.vy === 0;
      }

      player.x = clamp(player.x, 0, world.w - player.w);
      player.y = clamp(player.y, 0, world.h - 2);

      hpFill.style.width = (player.hp / player.maxHp) * 100 + "%";
      hpText.textContent = Math.round(player.hp) + " / " + player.maxHp;
    }

    function updateHotbar() {
      hotbar.innerHTML = "";
      hotbarItems.forEach((item, index) => {
        const slot = document.createElement("div");
        slot.className = "slot" + (selectedSlot === index ? " sel" : "");

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.style.background = ["#89c95f", "#8d979d", "#c89f5e", "#d9c77d"][index] || "#7cc0ff";

        const count = document.createElement("div");
        count.className = "count";
        count.textContent = index + 1;

        slot.appendChild(icon);
        slot.appendChild(count);
        hotbar.appendChild(slot);
      });
    }

    function addChatMessage(name, msg) {
      const line = document.createElement("div");
      line.className = "chatLine";
      line.innerHTML = '<span class="chatName">' + name + ':</span> ' + msg;
      chatMessages.appendChild(line);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showPanel(id) {
      document.querySelectorAll(".panel").forEach(el => {
        if (el.id === id) {
          el.classList.remove("hidden");
        } else if (el.id !== "menu") {
          el.classList.add("hidden");
        }
      });
    }

    function hidePanels() {
      document.querySelectorAll(".panel").forEach(el => el.classList.add("hidden"));
    }

    function startGame() {
      started = true;
      menu.classList.add("hidden");
      chatBox.classList.remove("hidden");
      document.getElementById("gameUI").style.pointerEvents = "auto";
    }

    function togglePause() {
      paused = !paused;
      document.getElementById("pause").style.display = paused ? "grid" : "none";
    }

    function loop(ts) {
      const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.033);
      lastTime = ts;

      if (!paused && started) {
        updatePlayer(dt);
      }

      render();
      requestAnimationFrame(loop);
    }

    document.getElementById("play").addEventListener("click", startGame);
    document.getElementById("settings").addEventListener("click", () => showPanel("settingsPanel"));
    document.getElementById("craftBtn").addEventListener("click", () => showPanel("craft"));
    document.getElementById("gameSettingsBtn").addEventListener("click", () => showPanel("settingsPanel"));
    document.getElementById("chatBtn").addEventListener("click", () => chatBox.classList.toggle("hidden"));
    document.getElementById("pauseBtn").addEventListener("click", togglePause);
    document.getElementById("resume").addEventListener("click", togglePause);
    document.getElementById("menuBack").addEventListener("click", () => {
      paused = false;
      document.getElementById("pause").style.display = "none";
      menu.classList.remove("hidden");
      chatBox.classList.add("hidden");
      started = false;
    });

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => {
        const panel = btn.closest(".panel");
        if (panel) panel.classList.add("hidden");
      });
    });

    document.getElementById("chatSend").addEventListener("click", () => {
      const value = chatInput.value.trim();
      if (!value) return;
      addChatMessage("Ty", value);
      chatInput.value = "";
    });

    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        document.getElementById("chatSend").click();
      }
    });

    window.addEventListener("keydown", (event) => {
      keys[event.code] = true;
      if (event.code === "Escape") {
        if (started) togglePause();
      }
      if (event.code === "KeyE") {
        showPanel("craft");
      }
    });

    window.addEventListener("keyup", (event) => {
      keys[event.code] = false;
    });

    window.addEventListener("resize", resizeCanvas);

    function init() {
      resizeCanvas();
      initWorld();
      updateHotbar();
      addChatMessage("System", "Witamy w Pixel World.");
      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
